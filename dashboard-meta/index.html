<script>
// ─── CONFIG ──────────────────────────────────────────────────────
const SHEET_ID = '1Djqb9kAgEERHhbmtJXEc64rX7D_251diNJXpTXC1sLI';
const SHEET_TAB = 'Meta Ads';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;

// Mots-clés pour identifier les campagnes META à inclure
const META_KEYWORDS = ['communication', 'design', 'architecture', 'impression', '3d', 'autocad', 'blender', 'meta'];

// ─── HYPOTHÈSES ROAS ─────────────────────────────────────────────
// Basé sur les données historiques Pipedrive (ajuster ici quand on a la donnée réelle)
const CONV_LEAD_TO_SALE = 0.18;     // Taux de conversion Lead → Vente (18%)
const AOV_EUR = 2054;                // Panier moyen € HT
const REV_PER_LEAD = CONV_LEAD_TO_SALE * AOV_EUR;  // ≈ 369.72€ par lead

const PAL = ['#F97316','#0F1419','#60a5fa','#16a34a','#a855f7','#ec4899','#f59e0b','#06b6d4','#84cc16','#ef4444'];

// ─── STATE ───────────────────────────────────────────────────────
let RAW = [];        // tous les rows parsés
let DATE_MIN, DATE_MAX;

// ─── HELPERS ─────────────────────────────────────────────────────
const fnum = n => new Intl.NumberFormat('fr-FR').format(Math.round(n));
const feur = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const feur2 = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n);
const fpct = n => (n*100).toFixed(2)+'%';
const fdate = d => d.toISOString().split('T')[0];

// Excel/Sheets serial date → JS Date
function serialToDate(s) {
  return new Date(Math.round((s - 25569) * 86400) * 1000);
}

// Parse number with comma decimal (FR format)
function pnum(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return v;
  return parseFloat(String(v).replace(/\s/g,'').replace(',','.')) || 0;
}

// Format month label
function ymKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function ymLabel(k) {
  const [y,m] = k.split('-');
  return ['Janv','Fév','Mars','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'][+m-1] + ' ' + y;
}

function rpill(r, type='cpl'){
  if(r===0||r===null||isNaN(r)) return `<span class="rp rp-z">—</span>`;
  if (type === 'cpl') {
    // CPL: lower is better. <30€ great, 30-60 ok, >60 bad
    const cls = r<=30?'rp-hi':r<=60?'rp-md':'rp-lo';
    return `<span class="rp ${cls}">${feur(r)}</span>`;
  }
  if (type === 'ctr') {
    const cls = r>=0.015?'rp-hi':r>=0.008?'rp-md':'rp-lo';
    return `<span class="rp ${cls}">${fpct(r)}</span>`;
  }
  return `<span class="rp">${r}</span>`;
}

// ─── DATA LOADING ────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csv = await res.text();
    const parsed = Papa.parse(csv, { header: true, skipEmptyLines: true });

    RAW = parsed.data.map(r => {
      const dateRaw = r['Date'];
      const dateNum = typeof dateRaw === 'number' ? dateRaw : pnum(dateRaw);
      const date = dateNum > 1000 ? serialToDate(dateNum) : new Date(dateRaw);
      return {
        date,
        campaign: (r['Campagne'] || r['Campagne '] || '').trim(),
        adset: (r['Ad Set'] || '').trim(),
        creative: (r['Publicité'] || '').trim(),
        impressions: pnum(r['Impressions']),
        reach: pnum(r['Reach']),
        clicks: pnum(r['Clics']),
        spend: pnum(r['Dépenses (€)']),
        leads: pnum(r['Leads']),
        platform: (r['Plateforme'] || '').trim()
      };
    }).filter(r => r.date && !isNaN(r.date) && r.campaign);

    // Date range
    const dates = RAW.map(r => r.date.getTime());
    DATE_MIN = new Date(Math.min(...dates));
    DATE_MAX = new Date(Math.max(...dates));

    // Populate campaign filter
    const camps = [...new Set(RAW.map(r => r.campaign))].sort();
    const sel = document.getElementById('camp-filter');
    camps.forEach(c => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    });

    // Init date inputs
    document.getElementById('dfrom').value = fdate(DATE_MIN);
    document.getElementById('dto').value = fdate(DATE_MAX);

    // Rebuild content shell
    renderShell();
    rerender();

  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="error"><b>Erreur de chargement.</b><br>${e.message}<br><br>Vérifie que le sheet est partagé en "Anyone with the link" et que l'onglet s'appelle bien "${SHEET_TAB}".</div>`;
  }
}

// ─── RENDER SHELL ────────────────────────────────────────────────
function renderShell() {
  document.getElementById('content').innerHTML = `
    <div class="slabel">Vue d'ensemble <span class="slabel-pill">Meta Ads · Live</span> <span class="slabel-pill na" title="Hypothèses tunables dans le code">ROAS estimé · ${(CONV_LEAD_TO_SALE*100).toFixed(0)}% × ${AOV_EUR}€</span></div>
    <div class="krow">
      <div class="kcard hi"><div class="klabel">Dépenses</div><div class="kval" id="k-spend">—</div><div class="ksub" id="k-spend-s"></div></div>
      <div class="kcard hi"><div class="klabel">Revenus est.</div><div class="kval" id="k-rev">—</div><div class="ksub" id="k-rev-s"></div></div>
      <div class="kcard hi"><div class="klabel">ROAS est.</div><div class="kval" id="k-roas">—</div><div class="ksub" id="k-roas-s"></div></div>
      <div class="kcard"><div class="klabel">Leads</div><div class="kval" id="k-leads">—</div><div class="ksub" id="k-leads-s"></div></div>
      <div class="kcard"><div class="klabel">CPL Moyen</div><div class="kval" id="k-cpl">—</div><div class="ksub" id="k-cpl-s"></div></div>
      <div class="kcard"><div class="klabel">CTR</div><div class="kval" id="k-ctr">—</div><div class="ksub" id="k-ctr-s"></div></div>
    </div>

    <div class="slabel">Performances</div>
    <div class="cgrid">
      <div class="cc"><div class="ctitle">Dépenses & Leads · Mensuel</div><div class="cwrap"><canvas id="cTrend"></canvas></div></div>
      <div class="cc"><div class="ctitle">CPL par Campagne</div><div class="cwrap"><canvas id="cCpl"></canvas></div></div>
    </div>
    <div class="cgrid2">
      <div class="cc"><div class="ctitle">Répartition des Dépenses · Campagnes</div><div class="cwrap"><canvas id="cSpend"></canvas></div></div>
      <div class="cc"><div class="ctitle">Leads par Plateforme</div><div class="cwrap"><canvas id="cPlat"></canvas></div></div>
    </div>

    <div class="slabel">Performances Mensuelles</div>
    <div class="tcard">
      <table>
        <thead><tr>
          <th>Mois</th><th>Dépenses</th><th>Revenus est.</th><th>ROAS est.</th>
          <th>Leads</th><th>CPL</th>
          <th>Impressions</th><th>Clics</th><th>CTR</th><th>CPC</th>
        </tr></thead>
        <tbody id="monthly-tbody"></tbody>
      </table>
    </div>

    <div class="slabel">Par Campagne · Cliquer pour voir les créatifs</div>
    <div class="camp-grid" id="camp-grid"></div>

    <div class="slabel">Pipeline Commercial <span class="slabel-pill na">Pipedrive · à connecter</span></div>
    <div class="pd-section">
      <div class="pd-hdr">
        <div>
          <div class="pd-title">Par mois</div>
          <div class="pd-sub">Leads créés · Deals gagnés par date de gain</div>
        </div>
        <div class="pd-pill">Pipedrive (N/A)</div>
      </div>
      <div class="pd-bar"></div>

      <div class="pd-funnel">
        <div class="pd-funnel-title">
          <span>Entonnoir de conversion</span>
          <span style="font-size:11px;color:rgba(255,255,255,.6)">Lead → Gagné : <b style="color:#fff">N/A</b></span>
        </div>

// ─── FILTER + AGGREGATE ──────────────────────────────────────────
function filterRows(fromStr, toStr, campaign) {
  const from = new Date(fromStr), to = new Date(toStr);
  to.setHours(23,59,59,999);
  return RAW.filter(r => {
    if (r.date < from || r.date > to) return false;
    if (campaign && r.campaign !== campaign) return false;
    return true;
  });
}

function aggregate(rows) {
  const a = { spend:0, leads:0, impressions:0, reach:0, clicks:0 };
  rows.forEach(r => {
    a.spend += r.spend; a.leads += r.leads;
    a.impressions += r.impressions; a.reach += r.reach; a.clicks += r.clicks;
  });
  a.cpl = a.leads > 0 ? a.spend / a.leads : null;
  a.ctr = a.impressions > 0 ? a.clicks / a.impressions : 0;
  a.cpc = a.clicks > 0 ? a.spend / a.clicks : 0;
  a.cpm = a.impressions > 0 ? a.spend / a.impressions * 1000 : 0;
  // ROAS estimé : revenu estimé = leads × (conv × AOV)
  a.revenue = a.leads * REV_PER_LEAD;
  a.roas = a.spend > 0 ? a.revenue / a.spend : 0;
  // Sales estimées
  a.salesEst = a.leads * CONV_LEAD_TO_SALE;
  return a;
}

function rpillRoas(r){
  if(!r||isNaN(r)) return `<span class="rp rp-z">—</span>`;
  const cls = r>=2?'rp-hi':r>=1?'rp-md':'rp-lo';
  return `<span class="rp ${cls}">${r.toFixed(2)}×</span>`;
}

function groupBy(rows, key) {
  const map = new Map();
  rows.forEach(r => {
    const k = typeof key === 'function' ? key(r) : r[key];
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  });
  return map;
}

// ─── KPI ANIMATION ───────────────────────────────────────────────
function animKPI(id, newVal, fmt){
  const el = document.getElementById(id);
  const prev = parseFloat(el.dataset.raw) || 0;
  el.dataset.raw = newVal;
  const dur = 450, t0 = performance.now();
  function step(now){
    const p = Math.min((now-t0)/dur,1);
    const e = 1-Math.pow(1-p,3);
    const v = prev + (newVal-prev)*e;
    el.textContent = fmt(v);
    if(p<1) requestAnimationFrame(step);
    else el.textContent = fmt(newVal);
  }
  requestAnimationFrame(step);
}
function setS(id,v,cls){ const el=document.getElementById(id); if(el){ el.textContent=v; el.className='ksub '+(cls||''); } }

// ─── CHARTS ──────────────────────────────────────────────────────

// ─── MAIN RENDER ─────────────────────────────────────────────────
function rerender() {
  const fromStr = document.getElementById('dfrom').value;
  const toStr = document.getElementById('dto').value;
  const campSel = document.getElementById('camp-filter').value;

  const rows = filterRows(fromStr, toStr, campSel);
  const agg = aggregate(rows);

  // KPIs
  animKPI('k-spend', agg.spend, v=>feur(v));
  animKPI('k-rev', agg.revenue, v=>feur(v));
  animKPI('k-roas', agg.roas, v=>v.toFixed(2)+'×');
  animKPI('k-leads', agg.leads, v=>fnum(v));
  animKPI('k-cpl', agg.cpl||0, v=>agg.cpl?feur(v):'—');
  document.getElementById('k-ctr').textContent = fpct(agg.ctr);

  // KPI sub-labels + classes
  document.getElementById('k-roas').className = 'kval ' + (agg.roas>=2?'gr':agg.roas>=1?'or':'rd');
  document.getElementById('k-cpl').className = 'kval ' + (agg.cpl===null?'':(agg.cpl<=30?'gr':agg.cpl<=60?'or':'rd'));
  setS('k-spend-s', 'CPM : ' + feur2(agg.cpm) + ' · CPC : ' + feur2(agg.cpc), '');
  setS('k-rev-s', '≈ ' + Math.round(agg.salesEst) + ' ventes estimées', '');
  setS('k-roas-s', agg.roas>=2?'▲ ROAS > 2×':agg.roas>=1?'Au-dessus du break-even':'▼ Sous le break-even', agg.roas>=2?'up':agg.roas<1?'dn':'');
  setS('k-leads-s', rows.length + ' rows · ' + new Set(rows.map(r=>r.creative)).size + ' créas · ' + fnum(agg.impressions) + ' impr.', '');
  setS('k-cpl-s', agg.cpl===null?'Aucun lead':(agg.cpl<=60?'✓ Objectif < 60€':'⚠ Au-dessus de 60€'), agg.cpl<=60?'up':'dn');
  setS('k-ctr-s', agg.ctr>=0.015?'▲ Au-dessus de 1.5%':'Objectif > 1.5%', agg.ctr>=0.015?'up':'');

  killCharts();
  renderTrendChart(rows);
  renderCplChart(rows);
  renderSpendChart(rows);
  renderPlatformChart(rows);
  renderMonthlyTable(rows);
  renderCampaignCards(rows, fromStr, toStr);
  renderPipedriveTable(rows);
}

        {label:'Leads', data:leads, type:'line', borderColor:'#F97316', backgroundColor:'rgba(249,115,22,.1)', borderWidth:2.5, pointBackgroundColor:'#F97316', pointRadius:5, yAxisID:'y2', order:1, tension:.3, fill:true}

}

// ─── PERIOD SHORTCUTS ────────────────────────────────────────────
function go(k, btn){
  document.querySelectorAll('.pgrp .pbtn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const today = DATE_MAX || new Date();
  let from;
  if (k==='7d') { from = new Date(today); from.setDate(from.getDate()-7); }
  else if (k==='30d') { from = new Date(today); from.setDate(from.getDate()-30); }
  else if (k==='month') { from = new Date(today.getFullYear(), today.getMonth(), 1); }
  else { from = DATE_MIN || new Date(today.getFullYear(), 0, 1); }
  document.getElementById('dfrom').value = fdate(from);
  document.getElementById('dto').value = fdate(today);
  rerender();
}

function applyCustom() {
  document.querySelectorAll('.pgrp .pbtn').forEach(b=>b.classList.remove('active'));
  rerender();
}
