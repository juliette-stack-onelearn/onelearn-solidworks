  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>One Learn — Dashboard Meta Ads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800,900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      /* One Learn — palette officielle */
      --ol-orange:     #EF7738;   /* Primary 02 */
      --ol-orange-md:  #E66A40;   /* CTA primaire */
      --ol-orange-dk:  #CD5025;   /* CTA dark */
      --ol-orange-lt:  #FDE2D2;   /* surface accent */
      --ol-violet:     #545AC0;   /* Primary 04 */
      --ol-violet-dk:  #43489A;
      --ol-violet-d2:  #323673;
      --ol-indigo:     #22244D;   /* Fond sombre premium */
      --ol-lavande:    #EDEDFB;   /* Primary 01 — fond app */
      --ol-text:       #282C37;   /* Primary 03 */

      /* Greys nommés One Learn */
      --cloud:         #EDEFF7;
      --smoke:         #D3D6E0;
      --steel:         #BCBFCC;
      --space:         #9DA2B3;
      --graphite:      #6E7180;
      --arsenic:       #40424D;
      --phantom:       #1E1E24;

      /* États */
      --success:       #16a34a;
      --warning:       #E66A40;
      --error:         #dc2626;

      /* Tokens dashboard */
      --bg:            var(--ol-lavande);
      --surface:       #ffffff;
      --border:        var(--smoke);
      --border-soft:   var(--cloud);
      --text:          var(--ol-text);
      --muted:         var(--graphite);

      color-scheme: light;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--text); font-size:13px; line-height:1.5; font-feature-settings:'cv11','ss01'; }
    h1,h2,h3,h4 { font-family:'Satoshi','Inter',sans-serif; letter-spacing:-.01em; }

    /* HEADER */
    .hdr { background:var(--ol-indigo); color:#fff; padding:20px 40px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .hdr-l { display:flex; align-items:center; gap:20px; }
    .logo { font-family:'Satoshi','Inter',sans-serif; font-size:22px; font-weight:800; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; }
    .logo-mark { width:32px; height:32px; border-radius:8px; background:var(--ol-violet); display:flex; align-items:center; justify-content:center; position:relative; }
    .logo-mark::before { content:''; position:absolute; top:6px; left:50%; transform:translateX(-50%); width:18px; height:6px; background:var(--ol-orange); border-radius:2px 2px 0 0; }
    .logo-mark::after { content:''; position:absolute; top:11px; left:50%; transform:translateX(-50%); width:2px; height:8px; background:var(--ol-orange); }
    .logo .one { color:#fff; font-weight:800; }
    .logo .learn { color:var(--ol-orange); font-weight:800; }
    .hdiv { width:1px; height:28px; background:rgba(255,255,255,.15); }
    .hdr-title { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.55); font-weight:500; }
    .hdr-r { display:flex; align-items:center; gap:18px; }
    .live-badge { display:flex; align-items:center; gap:8px; font-size:11px; color:rgba(255,255,255,.65); font-weight:500; }
    .live-dot { width:8px; height:8px; border-radius:50%; background:var(--ol-orange); box-shadow:0 0 0 3px rgba(239,119,56,.25); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .hbtns { display:flex; gap:8px; }
    .hbtn { display:flex; align-items:center; gap:6px; padding:7px 13px; border:1px solid rgba(255,255,255,.18); border-radius:9px; background:rgba(255,255,255,.06); color:#fff; font-size:12px; font-weight:600; font-family:inherit; cursor:pointer; transition:all .15s; }
    .hbtn:hover { background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.3); }
    .hbtn svg { width:14px; height:14px; }

    /* FILTERS */
    .flt { background:#fff; border-bottom:1px solid var(--border-soft); padding:12px 40px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
    .flabel { font-size:11px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); }
    .pgrp { display:flex; gap:4px; padding:3px; background:var(--cloud); border-radius:10px; }
    .pbtn { padding:7px 14px; border:none; border-radius:7px; background:transparent; font-size:12px; font-weight:500; cursor:pointer; color:var(--graphite); font-family:inherit; transition:all .15s; }
    .pbtn:hover { color:var(--ol-indigo); background:rgba(255,255,255,.5); }
    .pbtn.active { background:var(--ol-indigo); color:#fff; box-shadow:0 1px 3px rgba(34,36,77,.2); }
    .fsep { color:var(--smoke); }
    .drange { display:flex; align-items:center; gap:8px; }
    .dinput { padding:7px 10px; border:1px solid var(--border); border-radius:8px; font-size:12px; font-family:inherit; color:var(--text); }
    .dinput:focus { outline:none; border-color:var(--ol-violet); box-shadow:0 0 0 3px rgba(84,90,192,.12); }
    .csel { padding:7px 12px; border:1px solid var(--border); border-radius:8px; font-size:12px; font-family:inherit; color:var(--text); background:#fff; cursor:pointer; font-weight:500; }
    .csel:focus { outline:none; border-color:var(--ol-violet); box-shadow:0 0 0 3px rgba(84,90,192,.12); }
    .cmp-toggle { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--graphite); font-weight:500; cursor:pointer; user-select:none; }
    .cmp-toggle input { accent-color:var(--ol-violet); width:15px; height:15px; cursor:pointer; }

    /* MAIN */
    .main { padding:32px 40px 64px; max-width:1600px; margin:0 auto; }
    .slabel { font-family:'Satoshi','Inter',sans-serif; font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--graphite); margin-bottom:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .slabel-pill { padding:3px 10px; border-radius:6px; background:var(--ol-orange-lt); color:var(--ol-orange-dk); font-size:10px; letter-spacing:.3px; font-weight:600; text-transform:none; }
    .slabel-pill.na { background:var(--cloud); color:var(--graphite); }
    .slabel-pill.violet { background:rgba(84,90,192,.1); color:var(--ol-violet); }
    .slabel-pill.live { background:rgba(22,163,74,.12); color:#15803d; }
    .slabel-spacer { flex:1; }
    .slabel-edit { padding:4px 10px; border-radius:6px; border:1px solid var(--smoke); background:#fff; color:var(--graphite); font-size:10px; letter-spacing:.3px; font-weight:600; cursor:pointer; text-transform:none; font-family:inherit; transition:all .15s; }
    .slabel-edit:hover { border-color:var(--ol-violet); color:var(--ol-violet); }

    /* ROAS SETTINGS */
    .roas-box { background:#fff; border:1px solid var(--smoke); border-radius:14px; padding:16px 20px; margin-bottom:24px; display:none; align-items:center; gap:22px; flex-wrap:wrap; }
    .roas-box.open { display:flex; }
    .roas-fld { display:flex; flex-direction:column; gap:5px; }
    .roas-fld label { font-size:10px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; color:var(--graphite); }
    .roas-fld .ipt { display:flex; align-items:center; gap:6px; }
    .roas-fld input { width:90px; padding:7px 9px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; color:var(--text); font-variant-numeric:tabular-nums; }
    .roas-fld input:focus { outline:none; border-color:var(--ol-violet); box-shadow:0 0 0 3px rgba(84,90,192,.12); }
    .roas-fld .unit { font-size:12px; color:var(--graphite); font-weight:600; }
    .roas-note { font-size:11px; color:var(--graphite); max-width:280px; line-height:1.5; }
    .roas-btn { padding:8px 16px; border:none; border-radius:9px; background:var(--ol-violet); color:#fff; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s; }
    .roas-btn:hover { background:var(--ol-violet-dk); }
    .roas-btn.ghost { background:var(--cloud); color:var(--graphite); }
    .roas-btn.ghost:hover { background:var(--smoke); }

    /* KPI */
    .krow { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:32px; }
    .kcard { background:var(--surface); border:1px solid var(--border-soft); border-radius:16px; padding:18px 18px 16px; position:relative; overflow:hidden; transition:all .2s; }
    .kcard:hover { border-color:var(--smoke); transform:translateY(-1px); box-shadow:0 4px 12px rgba(40,44,55,.04); }
    .kcard::before { content:''; position:absolute; top:0;left:0;right:0; height:3px; background:var(--ol-orange); opacity:0; transition:opacity .2s; }
    .kcard.hi::before { opacity:1; }
    .klabel { font-size:10px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:var(--graphite); margin-bottom:8px; }
    .kval { font-family:'Satoshi','Inter',sans-serif; font-size:26px; font-weight:700; color:var(--text); letter-spacing:-.02em; line-height:1; }
    .kval.gr { color:var(--success); }
    .kval.or { color:var(--ol-orange-dk); }
    .kval.rd { color:var(--error); }
    .ksub { font-size:11px; color:var(--graphite); margin-top:7px; font-weight:500; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .ksub .det { color:var(--space); font-weight:500; }
    .kdelta { font-weight:700; font-variant-numeric:tabular-nums; }
    .kdelta.up { color:var(--success); }
    .kdelta.dn { color:var(--error); }
    .kdelta.fl { color:var(--space); }

    /* HIGHLIGHTS */
    .hl-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:32px; }
    .hl { border-radius:16px; padding:18px 22px; border:1px solid var(--border-soft); background:#fff; display:flex; align-items:center; gap:18px; }
    .hl.best { border-color:rgba(22,163,74,.3); background:linear-gradient(135deg, rgba(22,163,74,.05), #fff 60%); }
    .hl.worst { border-color:rgba(220,38,38,.25); background:linear-gradient(135deg, rgba(220,38,38,.05), #fff 60%); }
    .hl-icon { width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .hl.best .hl-icon { background:rgba(22,163,74,.12); }
    .hl.worst .hl-icon { background:rgba(220,38,38,.1); }
    .hl-body { min-width:0; flex:1; }
    .hl-tag { font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; margin-bottom:3px; }
    .hl.best .hl-tag { color:var(--success); }
    .hl.worst .hl-tag { color:var(--error); }
    .hl-name { font-family:'Satoshi','Inter',sans-serif; font-weight:700; font-size:15px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hl-meta { font-size:11px; color:var(--graphite); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hl-stat { text-align:right; flex-shrink:0; }
    .hl-stat .v { font-family:'Satoshi','Inter',sans-serif; font-size:22px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
    .hl-stat .l { font-size:10px; color:var(--graphite); text-transform:uppercase; letter-spacing:.4px; font-weight:600; }

    /* CHARTS */
    .cgrid { display:grid; grid-template-columns:3fr 2fr; gap:16px; margin-bottom:16px; }
    .cgrid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:32px; }
    .cc { background:var(--surface); border:1px solid var(--border-soft); border-radius:20px; padding:24px 24px 20px; }
    .ctitle { font-family:'Satoshi','Inter',sans-serif; font-size:13px; font-weight:700; color:var(--text); margin-bottom:20px; letter-spacing:-.01em; }
    .cwrap { position:relative; height:240px; }

    /* TABLE */
    .tcard { background:var(--surface); border:1px solid var(--border-soft); border-radius:20px; padding:24px 24px 20px; margin-bottom:32px; overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    thead th { font-size:10px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:var(--graphite); text-align:right; padding:0 10px 12px; border-bottom:1px solid var(--border-soft); white-space:nowrap; }
    thead th:first-child { text-align:left; }
    tbody tr { border-bottom:1px solid var(--border-soft); transition:background .12s; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover:not(.tr) { background:var(--ol-lavande); }
    tbody td { padding:12px 10px; text-align:right; white-space:nowrap; font-size:13px; font-variant-numeric:tabular-nums; }
    tbody td:first-child { text-align:left; font-weight:600; font-size:13px; }
    .tr td { font-weight:700; background:var(--cloud); border-top:2px solid var(--border); }

    /* PILLS */
    .rp { display:inline-block; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }
    .rp-hi { background:rgba(22,163,74,.12); color:#15803d; }
    .rp-md { background:var(--ol-orange-lt); color:var(--ol-orange-dk); }
    .rp-lo { background:rgba(220,38,38,.1); color:var(--error); }
    .rp-z  { background:var(--cloud); color:var(--graphite); }

    .cname { display:flex; align-items:center; gap:8px; }
    .cdot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

    /* CAMPAIGN CARDS */
    .camp-grid { display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:32px; }
    .camp { background:var(--surface); border:1px solid var(--border-soft); border-radius:16px; overflow:hidden; transition:all .2s; }
    .camp:hover { border-color:var(--smoke); }
    .camp.open { border-color:var(--ol-violet); box-shadow:0 4px 16px rgba(84,90,192,.08); }
    .camp-hdr { padding:18px 24px; display:grid; grid-template-columns:2fr repeat(5,1fr) auto; gap:16px; align-items:center; cursor:pointer; transition:background .12s; }
    .camp-hdr:hover { background:var(--ol-lavande); }
    .camp-name { font-family:'Satoshi','Inter',sans-serif; font-weight:700; font-size:14px; display:flex; align-items:center; gap:12px; letter-spacing:-.01em; }
    .camp-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .camp-kpi { text-align:right; }
    .camp-kpi .lab { font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--graphite); font-weight:600; margin-bottom:3px; }
    .camp-kpi .val { font-family:'Satoshi','Inter',sans-serif; font-size:15px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
    .camp-chev { color:var(--space); font-size:14px; transition:transform .2s; }
    .camp.open .camp-chev { transform:rotate(180deg); color:var(--ol-violet); }
    .camp-body { display:none; padding:4px 24px 20px; border-top:1px solid var(--border-soft); background:var(--ol-lavande); }
    .camp.open .camp-body { display:block; }
    .seg { display:inline-flex; gap:3px; padding:3px; background:var(--cloud); border-radius:9px; margin:14px 0 6px; }
    .seg button { padding:6px 14px; border:none; border-radius:6px; background:transparent; font-size:11px; font-weight:600; cursor:pointer; color:var(--graphite); font-family:inherit; transition:all .15s; }
    .seg button.on { background:#fff; color:var(--ol-indigo); box-shadow:0 1px 2px rgba(34,36,77,.12); }
    .adgrp-name { font-weight:700; }
    .adset-badge { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:6px; font-size:11px; font-weight:600; }
    .adset-bdot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .cs-banner { background:rgba(84,90,192,.06); border:1px solid rgba(84,90,192,.18); border-radius:12px; padding:12px 16px; margin-bottom:16px; font-size:12px; line-height:1.6; color:var(--arsenic); }
    .cs-banner code { background:rgba(84,90,192,.12); color:var(--ol-violet); padding:1px 6px; border-radius:4px; font-size:11px; }
    .cs-pending { color:var(--ol-orange-dk); font-style:italic; font-weight:500; }
    .cs-vp { text-align:left !important; max-width:320px; white-space:normal !important; color:var(--arsenic); font-weight:500 !important; line-height:1.4; }

    /* TABS */
    .tabs { display:flex; gap:4px; margin-bottom:26px; border-bottom:1px solid var(--smoke); flex-wrap:wrap; }
    .tab { padding:11px 20px; border:none; background:transparent; font-family:'Satoshi','Inter',sans-serif; font-size:13px; font-weight:700; color:var(--graphite); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .15s; letter-spacing:-.01em; display:flex; align-items:center; gap:7px; }
    .tab:hover { color:var(--ol-indigo); }
    .tab.active { color:var(--ol-indigo); border-bottom-color:var(--ol-orange); }
    .tabpanel { animation:fadein .2s ease; }
    @keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

    /* IMPORT */
    .import-status { font-size:13px; line-height:1.7; margin-bottom:16px; color:var(--text); }
    .import-status code { background:var(--cloud); color:var(--ol-violet); padding:1px 6px; border-radius:4px; font-size:11px; }
    .import-ok { color:#15803d; font-weight:700; }
    .import-err { color:var(--error); font-weight:600; }
    .import-drop { display:flex; align-items:center; gap:20px; padding:34px 30px; border:2px dashed var(--steel); border-radius:18px; background:#fff; cursor:pointer; transition:all .15s; }
    .import-drop:hover, .import-drop.drag { border-color:var(--ol-violet); background:rgba(84,90,192,.05); }
    .import-ico { font-size:36px; line-height:1; }
    .import-txt { font-size:14px; color:var(--text); }
    .import-txt b { font-family:'Satoshi','Inter',sans-serif; }
    .import-txt span { font-size:12px; color:var(--graphite); }
    .import-actions { margin-top:16px; }
    .import-help { margin-top:24px; font-size:12px; line-height:1.9; color:var(--arsenic); background:var(--cloud); border-radius:14px; padding:18px 20px; }
    .import-help code { background:#fff; padding:1px 6px; border-radius:4px; font-size:11px; color:var(--ol-violet); }
    .ad-sub td:first-child { padding-left:26px; font-weight:500; color:var(--graphite); }

    /* PIPEDRIVE */
    .pd-section { background:linear-gradient(135deg, var(--ol-indigo) 0%, var(--ol-violet-d2) 100%); border-radius:20px; padding:28px; margin-bottom:32px; color:#fff; position:relative; overflow:hidden; }
    .pd-section::before { content:''; position:absolute; top:-50%; right:-20%; width:400px; height:400px; background:radial-gradient(circle, rgba(239,119,56,.12) 0%, transparent 70%); pointer-events:none; }
    .pd-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; position:relative; gap:16px; flex-wrap:wrap; }
    .pd-title { font-family:'Satoshi','Inter',sans-serif; font-size:20px; font-weight:700; letter-spacing:-.01em; }
    .pd-sub { font-size:13px; color:rgba(255,255,255,.55); margin-bottom:20px; }
    .pd-pill { padding:6px 14px; background:rgba(239,119,56,.18); color:var(--ol-orange); border-radius:8px; font-size:12px; font-weight:600; border:1px solid rgba(239,119,56,.25); }
    .pd-pill.live { background:rgba(22,163,74,.18); color:#86efac; border-color:rgba(22,163,74,.3); }
    .pd-bar { height:3px; background:linear-gradient(to right, var(--ol-orange), var(--ol-violet)); border-radius:2px; margin-bottom:22px; opacity:.6; }
    .pd-funnel { background:rgba(255,255,255,.05); border-radius:14px; padding:22px; margin-bottom:18px; position:relative; }
    .pd-funnel-title { font-family:'Satoshi','Inter',sans-serif; font-size:14px; font-weight:700; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; }
    .funnel-row { display:grid; grid-template-columns:100px 1fr 110px; gap:16px; align-items:center; margin-bottom:12px; }
    .funnel-lab { font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:rgba(255,255,255,.6); font-weight:600; }
    .funnel-bar { height:36px; background:rgba(255,255,255,.06); border-radius:8px; position:relative; overflow:hidden; }
    .funnel-fill { height:100%; display:flex; align-items:center; padding:0 14px; color:#fff; font-weight:700; font-size:13px; border-radius:8px; transition:width .5s ease; font-variant-numeric:tabular-nums; min-width:42px; }
    .funnel-side { font-size:12px; color:rgba(255,255,255,.65); text-align:right; }
    .funnel-side .badge { display:inline-block; padding:3px 10px; background:rgba(22,163,74,.22); color:#86efac; border-radius:6px; font-weight:600; }
    .funnel-side .badge.muted { background:rgba(255,255,255,.08); color:rgba(255,255,255,.55); }

// ─── HELPERS ─────────────────────────────────────────────────────
const fnum  = n => new Intl.NumberFormat('fr-FR').format(Math.round(n));
const feur  = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const feur2 = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n);
const fpct  = n => (n*100).toFixed(2)+'%';
const fdate = d => d.toISOString().split('T')[0];
const esc   = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function serialToDate(s){ return new Date(Math.round((s - 25569) * 86400) * 1000); }

function pnum(v){
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return v;
  return parseFloat(String(v).replace(/\s/g,'').replace(/ /g,'').replace(',','.')) || 0;
}

// Cellule date → Date (serial Sheets, ISO, ou JJ/MM/AAAA)
function parseDateCell(v){
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return v > 1000 ? serialToDate(v) : null;
  const s = String(v).trim();
  if (s === '') return null;
  const mfr = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (mfr){ let [,dd,mm,yy]=mfr; yy = yy.length===2 ? '20'+yy : yy; const d=new Date(+yy,+mm-1,+dd); return isNaN(d)?null:d; }
  if (/^\d+([.,]\d+)?$/.test(s)){ const n=pnum(s); if(n>20000 && n<80000) return serialToDate(n); }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function ymKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function ymLabel(k){
  const [y,m] = k.split('-');
  return ['Janv','Fév','Mars','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'][+m-1] + ' ' + y;
}

function rpill(r, type='cpl'){
  if(r===0||r===null||isNaN(r)) return `<span class="rp rp-z">—</span>`;

  if (type === 'ctr'){ const cls = r>=0.015?'rp-hi':r>=0.008?'rp-md':'rp-lo'; return `<span class="rp ${cls}">${fpct(r)}</span>`; }
  return `<span class="rp">${r}</span>`;
}
function rpillRoas(r){
  if(!r||isNaN(r)) return `<span class="rp rp-z">—</span>`;
  const cls = r>=2?'rp-hi':r>=1?'rp-md':'rp-lo';
  return `<span class="rp ${cls}">${r.toFixed(2)}×</span>`;

// ─── DATA LOADING ────────────────────────────────────────────────
async function loadData(){
  try {
    // Meta Ads (obligatoire)
    const res = await fetch(csvUrl(META_TAB));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csv = await res.text();
    const parsed = Papa.parse(csv, { header:true, skipEmptyLines:true });

    RAW = parsed.data.map(r => {
      const dateRaw = r['Date'];
      const dateNum = typeof dateRaw === 'number' ? dateRaw : pnum(dateRaw);
      const date = dateNum > 1000 ? serialToDate(dateNum) : new Date(dateRaw);
      return {
        date,
        campaign: (r['Campagne'] || r['Campagne '] || '').trim(),
        adset: (r['Ad Set'] || '').trim(),
        creative: (r['Publicité'] || '').trim(),
        impressions: pnum(r['Impressions']),
        reach: pnum(r['Reach']),
        clicks: pnum(r['Clics']),
        spend: pnum(r['Dépenses (€)']),
        leads: pnum(r['Leads']),
        platform: (r['Plateforme'] || '').trim()
      };
    }).filter(r => r.date && !isNaN(r.date) && r.campaign);

    const dates = RAW.map(r => r.date.getTime());
    DATE_MIN = new Date(Math.min(...dates));
    DATE_MAX = new Date(Math.max(...dates));

    // Pipedrive (optionnel — détection auto)
    await loadPipedrive();

    // Étendre la plage de dates pour englober aussi les dates Pipedrive
    recomputeDateBounds();

    // Filtre campagnes
    const camps = [...new Set(RAW.map(r => r.campaign))].sort();
    const sel = document.getElementById('camp-filter');
    camps.forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });

    document.getElementById('dfrom').value = fdate(DATE_MIN);
    document.getElementById('dto').value   = fdate(DATE_MAX);
    const metaMax = new Date(Math.max(...RAW.map(r => r.date.getTime())));
    document.getElementById('upd').textContent = metaMax.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});

    renderShell();
    rerender();
    updateImportStatus([], null);
  } catch (e){
    document.getElementById('content').innerHTML =
      `<div class="error"><b>Erreur de chargement.</b><br>${esc(e.message)}<br><br>Vérifie que le sheet est partagé en « Anyone with the link » et que l'onglet s'appelle bien « ${META_TAB} ».</div>`;
  }
}

// Source des données Pipedrive : import navigateur (localStorage) sinon données embarquées
function getPdSource(){
  try { const s = JSON.parse(localStorage.getItem('ol_pd_import') || 'null'); if (s && Array.isArray(s.deals) && Array.isArray(s.leads)) return s; } catch(e){}
  return null;
}
function loadPipedrive(){
  try {
    const src = getPdSource();
    const deals = src ? src.deals : PD_DEALS_RAW;
    const leads = src ? src.leads : PD_LEADS_DATA;
    PD_RAW = deals.map(d => ({
      created: parseDateCell(d.c),
      won:     parseDateCell(d.w),
      status:  String(d.s || '').toLowerCase(),
      amount:  pnum(d.a),
      campaign: mapPdCamp(d.u, d.f),
      content: String(d.ct || '').trim()   // utm_content = nom du créatif
    })).filter(d => d.created);
    PD_LEADS_RAW = leads.map(l => ({
      created: parseDateCell(l.c),
      campaign: mapPdCamp(l.u, l.f),
      content: String(l.ct || '').trim()
    })).filter(l => l.created);
    PD_AVAILABLE = PD_RAW.length > 0 || PD_LEADS_RAW.length > 0;
  } catch (e){ PD_AVAILABLE = false; }
}

// Recalcule la plage de dates (Meta + Pipedrive)
function recomputeDateBounds(){
  if (!RAW.length) return;
  const meta = RAW.map(r => r.date.getTime());
  let mn = Math.min(...meta), mx = Math.max(...meta);
  const pd = [...PD_RAW.flatMap(d => [d.created, d.won]), ...PD_LEADS_RAW.map(l => l.created)].filter(Boolean).map(d => d.getTime());
  if (pd.length){ mn = Math.min(mn, ...pd); mx = Math.max(mx, ...pd); }
  DATE_MIN = new Date(mn); DATE_MAX = new Date(mx);
}

// ─── IMPORT CSV PIPEDRIVE (navigateur) ───────────────────────────
function pdPick(row, ...subs){
  const keys = Object.keys(row);
  for (const s of subs){ const k = keys.find(k => k.toLowerCase().includes(s.toLowerCase())); if (k && row[k] != null && row[k] !== '') return row[k]; }
  return '';
}
const _dpart = v => String(v || '').trim().split(' ')[0];

function parsePipedriveCSV(text){
  const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
  const fields = (parsed.meta.fields || []).join(' | ').toLowerCase();
  const isDeals = fields.includes('affaire') || fields.includes('statut') || fields.includes('date de gain');
  if (isDeals){
    const rows = parsed.data.map(r => ({
      c:  _dpart(pdPick(r, 'Affaire créée', 'créée', 'date de création')),
      w:  _dpart(pdPick(r, 'Date de gain')),
      a:  pnum(pdPick(r, 'Valeur', 'Montant')),
      s:  String(pdPick(r, 'Statut')).toLowerCase(),
      u:  String(pdPick(r, 'utm_campaign')).trim(),
      f:  String(pdPick(r, 'Formation Principale', 'Formation')).trim(),
      ct: String(pdPick(r, 'utm_content')).trim()
    })).filter(d => d.c);
    return { type:'deals', rows };
  }
  const rows = parsed.data.map(r => ({
    c:  _dpart(pdPick(r, 'Prospect créé', 'prospect cr', 'date de création')),
    u:  String(pdPick(r, 'utm_campaign')).trim(),
    f:  String(pdPick(r, 'Formation Principale', 'Formation')).trim(),
    ct: String(pdPick(r, 'utm_content')).trim()
  })).filter(l => l.c);
  return { type:'leads', rows };
}

function handleImportFiles(files){
  if (!files || !files.length) return;
  const got = {}; const errs = []; let pending = files.length;
  [...files].forEach(f => {
    const reader = new FileReader();
    reader.onload = e => {
      try { const res = parsePipedriveCSV(e.target.result); if (res.rows.length) got[res.type] = res.rows; else errs.push(f.name + ' : aucune ligne reconnue'); }
      catch(err){ errs.push(f.name + ' : ' + err.message); }
      if (--pending === 0) finalizeImport(got, errs);
    };
    reader.onerror = () => { errs.push(f.name + ' : lecture impossible'); if (--pending === 0) finalizeImport(got, errs); };
    reader.readAsText(f, 'UTF-8');
  });
}

function finalizeImport(got, errs){
  const existing = getPdSource() || {};
  const deals = got.deals || existing.deals || PD_DEALS_RAW;
  const leads = got.leads || existing.leads || PD_LEADS_DATA;
  let ts = ''; try { ts = new Date().toISOString(); } catch(e){}
  try { localStorage.setItem('ol_pd_import', JSON.stringify({ deals, leads, ts })); } catch(e){ errs.push('Sauvegarde navigateur impossible (quota)'); }
  loadPipedrive();
  recomputeDateBounds();
  const df = document.getElementById('dfrom'), dt = document.getElementById('dto');
  if (df && dt && DATE_MIN && DATE_MAX){ df.value = fdate(DATE_MIN); dt.value = fdate(DATE_MAX); }
  rerender();
  updateImportStatus(errs, got);
}

function resetPdImport(){
  try { localStorage.removeItem('ol_pd_import'); } catch(e){}
  loadPipedrive();
  recomputeDateBounds();
  const df = document.getElementById('dfrom'), dt = document.getElementById('dto');
  if (df && dt && DATE_MIN && DATE_MAX){ df.value = fdate(DATE_MIN); dt.value = fdate(DATE_MAX); }
  rerender();
  updateImportStatus([], null);
}

function updateImportStatus(errs, got){
  const el = document.getElementById('import-status'); if (!el) return;
  const src = getPdSource();
  const tagged = PD_RAW.filter(d => d.content).length;
  let html = '';
  if (src){
    let ts = ''; try { ts = src.ts ? new Date(src.ts).toLocaleString('fr-FR') : ''; } catch(e){}
    html += `<span class="import-ok">✅ Données importées actives</span> — <b>${PD_RAW.length}</b> deals (${tagged} tagués <code>utm_content</code>) · <b>${PD_LEADS_RAW.length}</b> prospects${ts ? ` · importé le ${ts}` : ''}.`;
  } else {
    html += `Source actuelle : <b>données par défaut</b> (${PD_RAW.length} deals, ${PD_LEADS_RAW.length} prospects). Importe tes CSV pour les remplacer.`;
  }
  if (got){ const p = []; if (got.deals) p.push(`${got.deals.length} deals`); if (got.leads) p.push(`${got.leads.length} prospects`); if (p.length) html += `<br><span style="color:var(--graphite)">Dernier import : ${p.join(' + ')} chargé(s) ✓</span>`; }
  if (errs && errs.length) html += `<br><span class="import-err">⚠️ ${errs.join(' ; ')}</span>`;
  el.innerHTML = html;
}

// ─── AGGREGATION ─────────────────────────────────────────────────
function filterRows(fromStr, toStr, campaign){
  const from = new Date(fromStr), to = new Date(toStr);
  to.setHours(23,59,59,999);
  return RAW.filter(r => {
    if (r.date < from || r.date > to) return false;
    if (campaign && r.campaign !== campaign) return false;
    return true;
  });
}

function aggregate(rows){
  const a = { spend:0, leads:0, impressions:0, reach:0, clicks:0 };
  rows.forEach(r => { a.spend+=r.spend; a.leads+=r.leads; a.impressions+=r.impressions; a.reach+=r.reach; a.clicks+=r.clicks; });
  a.cpl = a.leads > 0 ? a.spend / a.leads : null;
  a.ctr = a.impressions > 0 ? a.clicks / a.impressions : 0;
  a.cpc = a.clicks > 0 ? a.spend / a.clicks : 0;
  a.cpm = a.impressions > 0 ? a.spend / a.impressions * 1000 : 0;
  // Estimation (fallback)
  a.revenue = a.leads * revPerLead();
  a.roas = a.spend > 0 ? a.revenue / a.spend : 0;
  a.salesEst = a.leads * SETTINGS.conv;
  return a;
}

// Pipedrive agrégé sur une plage (affaires = par date création, gagnés/CA = par date gain)
function pdAggregate(fromStr, toStr, campaign){
  const from = new Date(fromStr), to = new Date(toStr); to.setHours(23,59,59,999);
  const inRange = d => d && d >= from && d <= to;
  const campOk  = c => !campaign || c === campaign;
  let prospects=0, affaires=0, gagnes=0, ca=0;
  if (PD_AVAILABLE){
    PD_LEADS_RAW.forEach(l => { if (campOk(l.campaign) && inRange(l.created)) prospects++; });
    PD_RAW.forEach(d => {
      if (!campOk(d.campaign)) return;
      if (inRange(d.created)) affaires++;
      if (d.status.indexOf('gagn') === 0 && inRange(d.won)) { gagnes++; ca += d.amount; }
    });
  }
  return { prospects, affaires, gagnes, ca };
}
// Pipedrive par mois (clé YYYY-MM) — affaires par mois de création, gagnés/CA par mois de gain
function pdByMonth(fromStr, toStr, campaign){
  const from = new Date(fromStr), to = new Date(toStr); to.setHours(23,59,59,999);
  const inRange = d => d && d >= from && d <= to;
  const campOk  = c => !campaign || c === campaign;
  const m = {};
  const bucket = k => (m[k] = m[k] || { affaires:0, gagnes:0, ca:0 });
  if (PD_AVAILABLE) PD_RAW.forEach(d => {
    if (!campOk(d.campaign)) return;
    if (inRange(d.created)) bucket(ymKey(d.created)).affaires++;
    if (d.status.indexOf('gagn') === 0 && inRange(d.won)) { const b=bucket(ymKey(d.won)); b.gagnes++; b.ca += d.amount; }
  });
  return m;
}

function groupBy(rows, key){
  const map = new Map();
  rows.forEach(r => { const k = typeof key==='function' ? key(r) : r[key]; if(!map.has(k)) map.set(k,[]); map.get(k).push(r); });
  return map;
}

// ─── COMPARISON ──────────────────────────────────────────────────
function prevPeriod(fromStr, toStr){
  const from = new Date(fromStr), to = new Date(toStr);
  const len = Math.round((to - from)/86400000) + 1;
  const pTo = new Date(from); pTo.setDate(pTo.getDate()-1);
  const pFrom = new Date(pTo); pFrom.setDate(pFrom.getDate()-len+1);
  return [fdate(pFrom), fdate(pTo)];
}
function delta(cur, prev, lowerBetter){
  if (prev === 0 || prev == null || isNaN(prev) || !isFinite(prev))
    return `<span class="kdelta fl">·</span> <span class="det">pas d'historique</span>`;
  const d = (cur - prev) / Math.abs(prev);
  const flat = Math.abs(d) < 0.005;
  const up = d >= 0;
  const good = lowerBetter ? !up : up;
  const arrow = flat ? '→' : up ? '▲' : '▼';
  const cls = flat ? 'fl' : good ? 'up' : 'dn';
  return `<span class="kdelta ${cls}">${arrow} ${Math.abs(d*100).toFixed(0)}%</span> <span class="det">vs préc.</span>`;
}

// ─── KPI ANIM ────────────────────────────────────────────────────
function animKPI(id, newVal, fmt){
  const el = document.getElementById(id); if(!el) return;
  const prev = parseFloat(el.dataset.raw) || 0;
  el.dataset.raw = newVal;
  const dur=450, t0=performance.now();
  function step(now){ const p=Math.min((now-t0)/dur,1); const e=1-Math.pow(1-p,3); el.textContent=fmt(prev+(newVal-prev)*e); if(p<1) requestAnimationFrame(step); else el.textContent=fmt(newVal); }
  requestAnimationFrame(step);
}
function setSub(id, html){ const el=document.getElementById(id); if(el) el.innerHTML = html; }

// ─── MAIN RENDER ─────────────────────────────────────────────────
function rerender(){
  const fromStr = document.getElementById('dfrom').value;
  const toStr   = document.getElementById('dto').value;
  const campSel = document.getElementById('camp-filter').value;
  const cmp     = document.getElementById('cmp-toggle').checked;

  const rows = filterRows(fromStr, toStr, campSel);
  const agg  = aggregate(rows);

  // Pipedrive sur la période → ROAS réel si CA dispo
  const pd = pdAggregate(fromStr, toStr, campSel);
  const realMode = PD_AVAILABLE && pd.ca > 0;
  const revenue = realMode ? pd.ca : agg.revenue;
  const roas = agg.spend > 0 ? revenue / agg.spend : 0;

  // Comparaison période précédente
  let pAgg=null, pRev=null, pRoas=null, pPd=null;
  if (cmp){
    const [pf,pt] = prevPeriod(fromStr, toStr);
    const pRows = filterRows(pf, pt, campSel);
    pAgg = aggregate(pRows);
    pPd = pdAggregate(pf, pt, campSel);
    pRev = (PD_AVAILABLE && pPd.ca>0) ? pPd.ca : pAgg.revenue;
    pRoas = pAgg.spend>0 ? pRev/pAgg.spend : 0;
  }

  // Labels Revenus/ROAS (réel vs estimé)
  document.getElementById('k-rev-l').textContent  = realMode ? 'Revenus (CA réel)' : 'Revenus est.';
  document.getElementById('k-roas-l').textContent = realMode ? 'ROAS réel' : 'ROAS est.';
  document.getElementById('th-rev').textContent   = realMode ? 'Revenus' : 'Revenus est.';
  document.getElementById('th-roas').textContent  = realMode ? 'ROAS' : 'ROAS est.';
  const hint = document.getElementById('roas-hint'); if(hint) hint.textContent = `${(SETTINGS.conv*100).toFixed(0)}% × ${fnum(SETTINGS.aov)}€`;

  // KPIs
  animKPI('k-spend', agg.spend, v=>feur(v));
  animKPI('k-rev', revenue, v=>feur(v));
  animKPI('k-roas', roas, v=>v.toFixed(2)+'×');
  animKPI('k-leads', agg.leads, v=>fnum(v));
  animKPI('k-cpl', agg.cpl||0, v=>agg.cpl?feur(v):'—');
  document.getElementById('k-ctr').textContent = fpct(agg.ctr);

  document.getElementById('k-roas').className = 'kval ' + (roas>=2?'gr':roas>=1?'or':'rd');
  document.getElementById('k-cpl').className  = 'kval ' + (agg.cpl===null?'':(agg.cpl<=30?'gr':agg.cpl<=60?'or':'rd'));

  // Sous-titres : comparaison si activée, sinon détail
  if (cmp){
    setSub('k-spend-s', delta(agg.spend, pAgg.spend, false) + ` <span class="det">· CPC ${feur2(agg.cpc)}</span>`);
    setSub('k-rev-s',   delta(revenue, pRev, false) + ` <span class="det">· ${realMode?fnum(pd.gagnes)+' gagnés':Math.round(agg.salesEst)+' ventes est.'}</span>`);
    setSub('k-roas-s',  delta(roas, pRoas, false));
    setSub('k-leads-s', delta(agg.leads, pAgg.leads, false) + ` <span class="det">· ${new Set(rows.map(r=>r.creative)).size} créas</span>`);
    setSub('k-cpl-s',   agg.cpl===null?'<span class="det">Aucun lead</span>':delta(agg.cpl, pAgg.cpl, true));
    setSub('k-ctr-s',   delta(agg.ctr, pAgg.ctr, false));
  } else {
    setSub('k-spend-s', `<span class="det">CPM ${feur2(agg.cpm)} · CPC ${feur2(agg.cpc)}</span>`);
    setSub('k-rev-s',   `<span class="det">${realMode?fnum(pd.gagnes)+' deals gagnés':'≈ '+Math.round(agg.salesEst)+' ventes estimées'}</span>`);
    setSub('k-roas-s',  `<span class="kdelta ${roas>=2?'up':roas<1?'dn':'fl'}">${roas>=2?'▲ > 2×':roas>=1?'> break-even':'▼ < break-even'}</span>`);
    setSub('k-leads-s', `<span class="det">${rows.length} lignes · ${new Set(rows.map(r=>r.creative)).size} créas · ${fnum(agg.impressions)} impr.</span>`);
    setSub('k-cpl-s',   agg.cpl===null?'<span class="det">Aucun lead</span>':`<span class="kdelta ${agg.cpl<=60?'up':'dn'}">${agg.cpl<=60?'✓ < 60€':'⚠ > 60€'}</span>`);
    setSub('k-ctr-s',   `<span class="kdelta ${agg.ctr>=0.015?'up':'fl'}">${agg.ctr>=0.015?'▲ > 1.5%':'objectif 1.5%'}</span>`);
  }

  killCharts();
  renderTrendChart(rows);
  renderCplChart(rows);
  renderSpendChart(rows);
  renderPlatformChart(rows);
  renderMonthlyTable(rows, fromStr, toStr, campSel, realMode);
  renderCampaignCards(rows, fromStr, toStr, campSel, realMode);
  renderPipedrive(rows, fromStr, toStr, campSel);
}

// ─── HIGHLIGHTS ──────────────────────────────────────────────────
function renderHighlights(rows){
  const el = document.getElementById('hl-grid');
  const creas = [...groupBy(rows, r => r.campaign + ' ⟡ ' + (r.creative||'(sans nom)')).entries()]
    .map(([k, rs]) => {
      const a = aggregate(rs);
      const [camp, crea] = k.split(' ⟡ ');
      return { camp, crea, cpl:a.cpl, leads:a.leads, spend:a.spend };
    })
    .filter(c => c.leads >= 3 && c.cpl !== null)
    .sort((a,b) => a.cpl - b.cpl);

  if (creas.length < 2){
    el.innerHTML = `<div class="hl"><div class="hl-body"><div class="hl-meta">Pas assez de données sur la période (min. 3 leads par créatif).</div></div></div>`;
    return;
  }
  const best = creas[0], worst = creas[creas.length-1];
  const card = (c, kind, tag, icon) => `
    <div class="hl ${kind}">
      <div class="hl-icon">${icon}</div>
      <div class="hl-body">
        <div class="hl-tag">${tag}</div>
        <div class="hl-name" title="${esc(c.crea)}">${esc(c.crea)}</div>
        <div class="hl-meta">${esc(c.camp)} · ${fnum(c.leads)} leads · ${feur(c.spend)}</div>
      </div>
      <div class="hl-stat"><div class="v" style="color:${kind==='best'?'#16a34a':'#dc2626'}">${feur(c.cpl)}</div><div class="l">CPL</div></div>
    </div>`;
  el.innerHTML = card(best,'best','Meilleur CPL','🏆') + card(worst,'worst','CPL le plus élevé','⚠️');
}

// ─── MONTHLY TABLE ───────────────────────────────────────────────
function renderMonthlyTable(rows, fromStr, toStr, campSel, realMode){
  const tbody = document.getElementById('monthly-tbody');
  const byMonth = [...groupBy(rows, r=>ymKey(r.date)).entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  const pdM = pdByMonth(fromStr, toStr, campSel);

  let html = '';
  byMonth.forEach(([k,rs]) => {
    const a = aggregate(rs);
    const ca = (realMode && pdM[k]) ? pdM[k].ca : 0;
    const rev = realMode ? ca : a.revenue;
    const roas = a.spend>0 ? rev/a.spend : 0;
    html += `<tr>
      <td>${ymLabel(k)}</td>
      <td>${feur(a.spend)}</td>
      <td>${feur(rev)}</td>
      <td>${rpillRoas(roas)}</td>
      <td>${fnum(a.leads)}</td>
      <td>${a.cpl?rpill(a.cpl,'cpl'):'—'}</td>

      <td>${rpill(a.ctr,'ctr')}</td>
      <td>${feur2(a.cpc)}</td>
    </tr>`;
  });
  const t = aggregate(rows);
  const tPd = pdAggregate(fromStr, toStr, campSel);

  tbody.innerHTML = html;
}

// ─── CAMPAIGN CARDS (+ Ad Set / Créatif toggle) ──────────────────
function renderCampaignCards(rows, fromStr, toStr, campSel, realMode){
  const container = document.getElementById('camp-grid');
  const byCamp = [...groupBy(rows,'campaign').entries()].map(([c,rs])=>({ name:c, rows:rs, agg:aggregate(rs) })).sort((a,b)=>b.agg.spend-a.agg.spend);

  // Vue « Par créatif » : exhaustive — une ligne par (Ad Set × créatif), couleur = Ad Set d'appartenance
  const creaTable = (rs, color) => {
    const ac = adsetColors(rs);
    const items = [...groupBy(rs, r => (r.adset||'(sans nom)') + ' ⟡ ' + (r.creative||'(sans nom)')).entries()]
      .map(([k, rr]) => { const i = k.indexOf(' ⟡ '); return { adset:k.slice(0,i), name:k.slice(i+3), agg:aggregate(rr) }; })
      .sort((a,b)=>b.agg.spend-a.agg.spend);
    return `<table><thead><tr><th>Créatif</th><th>Ad Set</th><th>Dépenses</th><th>Leads</th><th>CPL</th><th>Impressions</th><th>Clics</th><th>CTR</th><th>CPC</th></tr></thead><tbody>
      ${items.map(cr=>{ const c = ac[cr.adset] || color; return `<tr>
        <td><div class="cname"><div class="cdot" style="background:${c}"></div>${esc(cr.name)}</div></td>
        <td style="text-align:left"><span class="adset-badge" style="background:${c}1f;color:${c}"><span class="adset-bdot" style="background:${c}"></span>${esc(cr.adset)}</span></td>
        <td>${feur2(cr.agg.spend)}</td><td>${fnum(cr.agg.leads)}</td><td>${cr.agg.cpl?rpill(cr.agg.cpl,'cpl'):'—'}</td>
        <td>${fnum(cr.agg.impressions)}</td><td>${fnum(cr.agg.clicks)}</td><td>${rpill(cr.agg.ctr,'ctr')}</td><td>${feur2(cr.agg.cpc)}</td>
      </tr>`; }).join('')}
    </tbody></table>`;
  };
  // Vue « Par Ad Set » : agrégat par Ad Set uniquement (pas de détail créatif), pastille couleur par Ad Set
  const adsetTable = (rs, color) => {
    const ac = adsetColors(rs);
    const adsets = [...groupBy(rs, r=>r.adset||'(sans nom)').entries()].map(([n,rr])=>({name:n, agg:aggregate(rr)})).sort((a,b)=>b.agg.spend-a.agg.spend);
    return `<table><thead><tr><th>Ad Set</th><th>Dépenses</th><th>Leads</th><th>CPL</th><th>Impressions</th><th>Clics</th><th>CTR</th><th>CPC</th></tr></thead><tbody>
      ${adsets.map(as=>{ const c = ac[as.name] || color; return `<tr>
        <td><div class="cname"><div class="cdot" style="background:${c};width:10px;height:10px"></div><span class="adgrp-name" style="color:${c}">${esc(as.name)}</span></div></td>
        <td>${feur2(as.agg.spend)}</td><td>${fnum(as.agg.leads)}</td><td>${as.agg.cpl?rpill(as.agg.cpl,'cpl'):'—'}</td>
        <td>${fnum(as.agg.impressions)}</td><td>${fnum(as.agg.clicks)}</td><td>${rpill(as.agg.ctr,'ctr')}</td><td>${feur2(as.agg.cpc)}</td>
      </tr>`; }).join('')}
    </tbody></table>`;
  };
  // Pipeline Pipedrive par créatif (utm_content) sur la période
  const _from = new Date(fromStr), _to = new Date(toStr); _to.setHours(23,59,59,999);
  const _inR = d => d && d >= _from && d <= _to;
  const pdc = {};
  PD_RAW.forEach(d => { if(!d.content) return; const b = pdc[d.content] = pdc[d.content] || {affaires:0, gagnes:0, ca:0}; if(_inR(d.created)) b.affaires++; if(d.status.indexOf('gagn')===0 && _inR(d.won)){ b.gagnes++; b.ca += d.amount; } });
  // Vue « Par proposition de valeur » : créatif + promesse + tag + signature
  const vpTable = (rs, color) => {
    const ac = adsetColors(rs);
    const items = [...groupBy(rs, r => r.creative||'(sans nom)').entries()].map(([name, rr]) => {
      const a = aggregate(rr);
      const sba = {}; rr.forEach(r => { const s=r.adset||'(sans nom)'; sba[s]=(sba[s]||0)+r.spend; });
      const adset = Object.entries(sba).sort((x,y)=>y[1]-x[1])[0]?.[0] || '—';
      const pd = pdc[name] || {affaires:0, gagnes:0, ca:0};
      const vpm = CREATIVE_VP[name] || {};
      return { name, adset, leads:a.leads, cpl:a.cpl, ...pd, vp:vpm.vp, tag:vpm.tag };
    }).filter(c => c.leads>0 || c.affaires>0).sort((a,b)=>(b.gagnes-a.gagnes)||(b.affaires-a.affaires)||(b.leads-a.leads));
    return `<table><thead><tr><th>Créatif</th><th>Proposition de valeur</th><th>Tag</th><th>Leads</th><th>CPL</th><th>Affaires</th><th>Gagnés</th><th>Taux sign.</th></tr></thead><tbody>
      ${items.map(c => { const col=ac[c.adset]||color; const tc=tagColor(c.tag); const taux=c.leads>0?c.gagnes/c.leads:0; return `<tr>
        <td><div class="cname"><div class="cdot" style="background:${col}"></div>${esc(c.name)}</div></td>
        <td class="cs-vp">${c.vp?esc(c.vp):'<span class="cs-pending">à définir</span>'}</td>
        <td style="text-align:left">${c.tag?`<span class="adset-badge" style="background:${tc}1f;color:${tc}"><span class="adset-bdot" style="background:${tc}"></span>${esc(c.tag)}</span>`:'—'}</td>
        <td>${fnum(c.leads)}</td>
        <td>${c.cpl?feur(c.cpl):'—'}</td>
        <td>${c.affaires?`<span class="rp rp-md">${fnum(c.affaires)}</span>`:'—'}</td>
        <td>${c.gagnes?fnum(c.gagnes):'—'}</td>
        <td>${c.gagnes>0?`<b>${fpct(taux)}</b>`:(c.affaires>0?'<span class="cs-pending">en cours</span>':'—')}</td>
      </tr>`; }).join('')}
    </tbody></table>`;
  };

  let html = '';
  byCamp.forEach((c,i) => {
    const color = PAL[i % PAL.length];
    const pdC = pdAggregate(fromStr, toStr, c.name);
    const realC = realMode && pdC.ca > 0;
    const rev = realC ? pdC.ca : c.agg.revenue;
    const roas = c.agg.spend>0 ? rev/c.agg.spend : 0;
    html += `<div class="camp">
      <div class="camp-hdr" onclick="this.parentElement.classList.toggle('open')">
        <div class="camp-name"><div class="camp-dot" style="background:${color}"></div>${esc(c.name||'(sans nom)')}</div>
        <div class="camp-kpi"><div class="lab">Dépenses</div><div class="val">${feur(c.agg.spend)}</div></div>
        <div class="camp-kpi hide-md"><div class="lab">${realC?'CA réel':'Revenus est.'}</div><div class="val">${feur(rev)}</div></div>
        <div class="camp-kpi hide-sm"><div class="lab">ROAS${realC?'':' est.'}</div><div class="val" style="color:${roas>=2?'#16a34a':roas>=1?'#C2410C':'#dc2626'}">${roas.toFixed(2)}×</div></div>
        <div class="camp-kpi"><div class="lab">Leads</div><div class="val">${fnum(c.agg.leads)}</div></div>
        <div class="camp-kpi"><div class="lab">CPL</div><div class="val">${c.agg.cpl?feur(c.agg.cpl):'—'}</div></div>
        <div class="camp-chev">▾</div>
      </div>
      <div class="camp-body">
        <div class="seg">
          <button class="on" onclick="segView(event,${i},'adset')">Par Ad Set</button>
          <button onclick="segView(event,${i},'crea')">Par créatif</button>
          <button onclick="segView(event,${i},'vp')">Par proposition de valeur</button>
        </div>
        <div id="seg-adset-${i}">${adsetTable(c.rows, color)}</div>
        <div id="seg-crea-${i}" style="display:none">${creaTable(c.rows, color)}</div>
        <div id="seg-vp-${i}" style="display:none">${vpTable(c.rows, color)}</div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
}
function segView(e, i, mode){
  e.stopPropagation();
  e.currentTarget.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  e.currentTarget.classList.add('on');
  ['adset','crea','vp'].forEach(m => { const el = document.getElementById('seg-'+m+'-'+i); if (el) el.style.display = (m===mode) ? 'block' : 'none'; });
}

// ─── CRÉATIF → SIGNATURE (join Meta.Publicité ⟷ Pipedrive.utm_content) ───
function renderCreativeSignature(rows, fromStr, toStr, campSel){
  const tbody  = document.getElementById('cs-tbody');
  const banner = document.getElementById('cs-banner');
  if (!tbody) return;

  const from = new Date(fromStr), to = new Date(toStr); to.setHours(23,59,59,999);
  const inR = d => d && d >= from && d <= to;
  const campOk = c => !campSel || c === campSel;

  // Pipedrive agrégé par créatif (utm_content)
  const pdByContent = {};
  let periodDeals = 0, taggedDeals = 0;
  PD_RAW.forEach(d => {
    if (inR(d.created) && campOk(d.campaign)) { periodDeals++; if (d.content) taggedDeals++; }
    if (!d.content) return;
    const b = pdByContent[d.content] = pdByContent[d.content] || { affaires:0, gagnes:0, ca:0 };
    if (inR(d.created) && campOk(d.campaign)) b.affaires++;
    if (d.status.indexOf('gagn') === 0 && inR(d.won) && campOk(d.campaign)) { b.gagnes++; b.ca += d.amount; }
  });
  const coverage = periodDeals ? taggedDeals / periodDeals : 0;

  // Créatifs Meta (lignes filtrées) → leads complets + ad set dominant
  const ac = adsetColors(rows);
  const items = [...groupBy(rows, r => r.creative || '(sans nom)').entries()].map(([name, rs]) => {
    const a = aggregate(rs);
    const spendByAdset = {}; rs.forEach(r => { const s = r.adset||'(sans nom)'; spendByAdset[s] = (spendByAdset[s]||0) + r.spend; });
    const adset = Object.entries(spendByAdset).sort((x,y)=>y[1]-x[1])[0]?.[0] || '—';
    const pd = pdByContent[name] || { affaires:0, gagnes:0, ca:0 };
    return { name, adset, leads:a.leads, cpl:a.cpl, ...pd };
  }).filter(c => c.leads > 0 || c.affaires > 0)
    .sort((a,b) => (b.gagnes - a.gagnes) || (b.affaires - a.affaires) || (b.leads - a.leads));

  banner.innerHTML = `Couverture <code>utm_content</code> : <b>${(coverage*100).toFixed(0)}%</b> des ${periodDeals} affaires de la période sont taguées (créatif tracké). `
    + (taggedDeals && Object.values(pdByContent).some(b=>b.gagnes>0)
        ? `Le taux de signature se calcule sur les deals gagnés tagués.`
        : `⏳ Aucun deal <b>gagné</b> n'est encore tagué (tracking récent) → le <b>taux de signature</b> se remplira à mesure que les deals tagués se gagnent. En attendant, la colonne <b>Affaires</b> montre le pipeline qui se forme par créatif.`)
    + (Object.keys(CREATIVE_VP).length === 0
        ? `<br>📝 <b>Propositions de valeur à renseigner</b> — envoie-moi la liste « créatif → promesse + tag » et je remplis les colonnes.`
        : '');

  let html = '';
  items.forEach(c => {
    const taux = c.leads > 0 ? c.gagnes / c.leads : 0;
    // 🔴 = volume de pipeline mais 0 signature ; 🟢 = signe ; sinon neutre
    const flag = c.gagnes > 0 ? (taux >= 0.05 ? '🟢' : '🔴')
               : (c.affaires >= 3 ? '🔴' : '');
    const col = ac[c.adset] || '#9DA2B3';
    const vpm = CREATIVE_VP[c.name] || {};
    const tc = tagColor(vpm.tag);
    html += `<tr>
      <td><div class="cname"><div class="cdot" style="background:${col}"></div>${esc(c.name)}</div></td>
      <td class="cs-vp">${vpm.vp ? esc(vpm.vp) : '<span class="cs-pending">à définir</span>'}</td>
      <td style="text-align:left">${vpm.tag ? `<span class="adset-badge" style="background:${tc}1f;color:${tc}"><span class="adset-bdot" style="background:${tc}"></span>${esc(vpm.tag)}</span>` : '—'}</td>
      <td>${fnum(c.leads)}</td>
      <td>${c.affaires ? `<span class="rp rp-md">${fnum(c.affaires)}</span>` : '—'}</td>
      <td>${c.gagnes ? fnum(c.gagnes) : '—'}</td>
      <td>${c.gagnes > 0 ? `<b>${fpct(taux)}</b>` : (c.affaires > 0 ? '<span class="cs-pending">en cours</span>' : '—')}</td>
      <td style="text-align:center;font-size:14px">${flag}</td>
    </tr>`;
  });
  tbody.innerHTML = html || `<tr><td colspan="8" style="text-align:center;color:var(--graphite);padding:24px">Aucun créatif sur la période.</td></tr>`;
}

// ─── PIPEDRIVE ───────────────────────────────────────────────────
function renderPipedrive(rows, fromStr, toStr, campSel){
  const totalLeads = rows.reduce((s,r)=>s+r.leads,0);
  const totalSpend = rows.reduce((s,r)=>s+r.spend,0);
  const pd = pdAggregate(fromStr, toStr, campSel);
  const NA = '<span class="pd-na">N/A</span>';

  // KPI strip
  const kpis = document.getElementById('pd-kpis');
  if (PD_AVAILABLE){
    const cac = pd.gagnes>0 ? totalSpend/pd.gagnes : 0;
    const panier = pd.gagnes>0 ? pd.ca/pd.gagnes : 0;
    const roi = totalSpend>0 ? (pd.ca-totalSpend)/totalSpend : 0;
    kpis.innerHTML = `
      <div class="pd-k"><div class="l">Prospects CRM</div><div class="v">${fnum(pd.prospects)}</div></div>
      <div class="pd-k"><div class="l">Affaires créées</div><div class="v">${fnum(pd.affaires)}</div></div>
      <div class="pd-k"><div class="l">Deals gagnés</div><div class="v">${fnum(pd.gagnes)}</div></div>
      <div class="pd-k"><div class="l">CA généré</div><div class="v">${feur(pd.ca)}</div></div>
      <div class="pd-k"><div class="l">CAC réel</div><div class="v">${pd.gagnes>0?feur(cac):NA}</div></div>
      <div class="pd-k"><div class="l">ROI</div><div class="v" style="color:${roi>=0?'#86efac':'#fca5a5'}">${totalSpend>0?(roi>=0?'+':'')+(roi*100).toFixed(0)+'%':NA}</div></div>`;
  } else {
    kpis.innerHTML = ['Prospects CRM','Affaires créées','Deals gagnés','CA généré','CAC réel','ROI'].map(l=>`<div class="pd-k"><div class="l">${l}</div><div class="v na">N/A</div></div>`).join('');
  }

  // Funnel
  const aff = pd.affaires, won = pd.gagnes;
  document.getElementById('pd-f-leads').textContent = fnum(totalLeads);
  const fAff = document.getElementById('pd-f-aff'), fWon = document.getElementById('pd-f-won');
  if (PD_AVAILABLE && totalLeads>0){
    fAff.style.width = Math.max(6, aff/totalLeads*100)+'%'; fAff.textContent = fnum(aff);
    fWon.style.width = Math.max(6, won/totalLeads*100)+'%'; fWon.textContent = fnum(won);
    document.getElementById('pd-side-aff').innerHTML = `<span class="badge">${aff>0?((aff/totalLeads)*100).toFixed(0):0}% des leads</span>`;
    document.getElementById('pd-side-won').innerHTML = `<span class="badge">${aff>0?((won/aff)*100).toFixed(0):0}% des affaires</span>`;
    document.getElementById('pd-conv-tot').textContent = totalLeads>0?((won/totalLeads)*100).toFixed(1)+'%':'—';
  } else {
    fAff.style.width='0%'; fAff.textContent='—'; fWon.style.width='0%'; fWon.textContent='—';
    document.getElementById('pd-side-aff').innerHTML = '<span class="badge muted">N/A</span>';
    document.getElementById('pd-side-won').innerHTML = '<span class="badge muted">N/A</span>';
    document.getElementById('pd-conv-tot').textContent = 'N/A';
  }

  // Table mensuelle
  const tbody = document.getElementById('pd-tbody');
  const byMonth = [...groupBy(rows, r=>ymKey(r.date)).entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  const pdM = pdByMonth(fromStr, toStr, campSel);
  const pct = (a,b)=> b>0 ? (a/b*100).toFixed(0)+'%' : '—';
  let html = '';
  byMonth.forEach(([k,rs]) => {
    const leads = rs.reduce((s,r)=>s+r.leads,0);
    const spend = rs.reduce((s,r)=>s+r.spend,0);
    const p = pdM[k] || {affaires:0,gagnes:0,ca:0};
    if (PD_AVAILABLE){
      const panier = p.gagnes>0?p.ca/p.gagnes:0;
      const cpl = leads>0?spend/leads:0;
      const cac = p.gagnes>0?spend/p.gagnes:0;
      const benef = p.ca - spend;
      const roi = spend>0?benef/spend:0;
      html += `<tr><td>${ymLabel(k)}</td><td>${fnum(leads)}</td><td>${fnum(p.affaires)}</td><td>${pct(p.affaires,leads)}</td>
        <td>${fnum(p.gagnes)}</td><td>${pct(p.gagnes,p.affaires)}</td><td>${pct(p.gagnes,leads)}</td>
        <td>${feur(p.ca)}</td><td>${p.gagnes>0?feur(panier):'—'}</td><td>${feur(spend)}</td>
        <td>${leads>0?feur(cpl):'—'}</td><td>${p.gagnes>0?feur(cac):'—'}</td>
        <td style="color:${benef>=0?'#86efac':'#fca5a5'}">${feur(benef)}</td><td style="color:${roi>=0?'#86efac':'#fca5a5'}">${spend>0?(roi>=0?'+':'')+(roi*100).toFixed(0)+'%':'—'}</td></tr>`;
    } else {
      html += `<tr><td>${ymLabel(k)}</td><td>${fnum(leads)}</td>${'<td class="pd-na">N/A</td>'.repeat(12)}</tr>`;
    }
  });
  // Total
  if (PD_AVAILABLE){
    const panier = pd.gagnes>0?pd.ca/pd.gagnes:0;
    const cpl = totalLeads>0?totalSpend/totalLeads:0;
    const cac = pd.gagnes>0?totalSpend/pd.gagnes:0;
    const benef = pd.ca-totalSpend;
    const roi = totalSpend>0?benef/totalSpend:0;
    html += `<tr class="tr"><td>Total</td><td>${fnum(totalLeads)}</td><td>${fnum(pd.affaires)}</td><td>${pct(pd.affaires,totalLeads)}</td>
      <td>${fnum(pd.gagnes)}</td><td>${pct(pd.gagnes,pd.affaires)}</td><td>${pct(pd.gagnes,totalLeads)}</td>
      <td>${feur(pd.ca)}</td><td>${pd.gagnes>0?feur(panier):'—'}</td><td>${feur(totalSpend)}</td>
      <td>${totalLeads>0?feur(cpl):'—'}</td><td>${pd.gagnes>0?feur(cac):'—'}</td>
      <td style="color:${benef>=0?'#86efac':'#fca5a5'}">${feur(benef)}</td><td style="color:${roi>=0?'#86efac':'#fca5a5'}">${(roi>=0?'+':'')+(roi*100).toFixed(0)+'%'}</td></tr>`;
  } else {
    html += `<tr class="tr"><td>Total</td><td>${fnum(totalLeads)}</td>${'<td class="pd-na">N/A</td>'.repeat(12)}</tr>`;
  }
  tbody.innerHTML = html;

  // Aide setup (si non connecté)
  const help = document.getElementById('pd-help');
  help.innerHTML = PD_AVAILABLE ? ''
    : `Pour activer : crée un onglet <code>Pipedrive</code> dans le même Google Sheet avec les colonnes <code>Date création</code> · <code>Date gain</code> · <code>Campagne</code> · <code>Statut</code> (Gagné / Perdu / Ouvert) · <code>Montant (€)</code> — une ligne par deal. Le dashboard le détecte automatiquement et passe le ROAS en réel.`;
}

// ─── ROAS SETTINGS UI ────────────────────────────────────────────
function toggleRoasBox(){
  const box = document.getElementById('roas-box');
  box.classList.toggle('open');
  if (box.classList.contains('open')){
    document.getElementById('set-conv').value = (SETTINGS.conv*100);
    document.getElementById('set-aov').value  = SETTINGS.aov;
    updateRoasNote();
  }
}
function updateRoasNote(){
  const conv = pnum(document.getElementById('set-conv').value)/100;
  const aov  = pnum(document.getElementById('set-aov').value);
  document.getElementById('roas-note').innerHTML = `Revenu estimé par lead : <b>${feur2(conv*aov)}</b>. ${PD_AVAILABLE?'Le CA réel Pipedrive prime quand il est disponible.':'Utilisé tant que Pipedrive n\'est pas connecté.'}`;
}
function applyRoas(){
  const conv = pnum(document.getElementById('set-conv').value)/100;
  const aov  = pnum(document.getElementById('set-aov').value);
  if (conv>0 && aov>0){ SETTINGS = { conv, aov }; saveSettings(); }
  document.getElementById('roas-box').classList.remove('open');
  rerender();
}
function resetRoas(){
  SETTINGS = { ...DEFAULTS }; saveSettings();
  document.getElementById('set-conv').value = SETTINGS.conv*100;
  document.getElementById('set-aov').value  = SETTINGS.aov;
  updateRoasNote();
  rerender();
}
document.addEventListener('input', e => { if(e.target.id==='set-conv'||e.target.id==='set-aov') updateRoasNote(); });

// ─── EXPORT CSV ──────────────────────────────────────────────────
function exportCSV(){
  const fromStr = document.getElementById('dfrom').value, toStr = document.getElementById('dto').value, campSel = document.getElementById('camp-filter').value;
  const rows = filterRows(fromStr, toStr, campSel);
  const realMode = PD_AVAILABLE && pdAggregate(fromStr,toStr,campSel).ca>0;
  const pdM = pdByMonth(fromStr,toStr,campSel);
  const byMonth = [...groupBy(rows, r=>ymKey(r.date)).entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  const head = ['Mois','Dépenses','Revenus','ROAS','Leads','CPL','Impressions','Clics','CTR','CPC'];
  const lines = [head.join(';')];
  byMonth.forEach(([k,rs])=>{
    const a = aggregate(rs);
    const rev = realMode && pdM[k] ? pdM[k].ca : a.revenue;
    const roas = a.spend>0?rev/a.spend:0;
    lines.push([ymLabel(k), a.spend.toFixed(2), rev.toFixed(2), roas.toFixed(2), a.leads, (a.cpl||0).toFixed(2), a.impressions, a.clicks, (a.ctr*100).toFixed(2)+'%', a.cpc.toFixed(2)].join(';'));
  });
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `onelearn-meta-${fromStr}_${toStr}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// ─── PERIOD SHORTCUTS ────────────────────────────────────────────
function go(k, btn){
  document.querySelectorAll('.pgrp .pbtn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const today = DATE_MAX || new Date();
  let from;
  if (k==='7d'){ from=new Date(today); from.setDate(from.getDate()-6); }
  else if (k==='30d'){ from=new Date(today); from.setDate(from.getDate()-29); }
  else if (k==='month'){ from=new Date(today.getFullYear(), today.getMonth(), 1); }
  else { from = DATE_MIN || new Date(today.getFullYear(),0,1); }
  document.getElementById('dfrom').value = fdate(from);
  document.getElementById('dto').value = fdate(today);
  rerender();
}
function applyCustom(){ document.querySelectorAll('.pgrp .pbtn').forEach(b=>b.classList.remove('active')); rerender(); }

loadData();
