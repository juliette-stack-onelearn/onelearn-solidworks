<script>
// ── Pages manifest — pour scaler, ajouter une ligne ici ──────────────────
var PAGES_MANIFEST = [
  { slug: 'solidworks',         file: 'solidworks.html',         name: 'SolidWorks — Formation' },
  { slug: 'onelearn-bim-final', file: 'onelearn-bim-final.html', name: 'BIM — Formation'        }
];

// État en mémoire — zero IndexedDB, zero perte de données
var PAGES = PAGES_MANIFEST.map(function(p) {
  return { id: p.slug, name: p.name, slug: p.slug, liveSlug: p.slug,
           status: 'live', fields: {}, images: [], html: '' };
});
function dbAll(cb)     { cb(PAGES.slice()); }
function dbGet(id, cb) { cb(PAGES.filter(function(p){ return p.id === id; })[0] || null); }
function dbPut(p, cb)  { var i = PAGES.findIndex(function(x){ return x.id === p.id; });
                         if (i >= 0) PAGES[i] = p; else PAGES.push(p); if (cb) cb(); }
function dbDel(id, cb) { PAGES = PAGES.filter(function(p){ return p.id !== id; }); if (cb) cb(); }

var GH = {
  owner: 'juliette-stack-onelearn', repo: 'onelearn-solidworks',
  branch: 'main', pagesBase: 'https://go.one-learn.fr/'
};
GH.token = function() { return localStorage.getItem('gh_token') || ''; };
GH.api = function(method, path, body, cb) {
  var opts = { method: method, headers: { 'Authorization': 'Bearer ' + GH.token(), 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' } };
  if (body) opts.body = JSON.stringify(body);
  fetch('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + path, opts)
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, data: j }; }); })
    .then(function(r) { cb(r.ok ? null : (r.data.message || 'Erreur GitHub'), r.data); })
    .catch(function(e) { cb(e.message, null); });
};
GH.getFilePublic = function(filename, cb) {
  fetch('https://raw.githubusercontent.com/' + GH.owner + '/' + GH.repo + '/' + GH.branch + '/' + filename + '?t=' + Date.now())
    .then(function(r) { return r.ok ? r.text().then(function(t) { cb(null, t); }) : cb(null, null); })
    .catch(function() { cb(null, null); });
};
GH.putFileLarge = function(filename, content, cb) {
  GH.api('POST', '/git/blobs', { content: content, encoding: 'utf-8' }, function(err, blob) {
    if (err) { cb(err); return; }
    GH.api('GET', '/git/refs/heads/' + GH.branch, null, function(err, ref) {
      if (err) { cb(err); return; }
      var headSha = ref.object.sha;
      GH.api('GET', '/git/commits/' + headSha, null, function(err, commit) {
        if (err) { cb(err); return; }
        GH.api('POST', '/git/trees', { base_tree: commit.tree.sha, tree: [{ path: filename, mode: '100644', type: 'blob', sha: blob.sha }] }, function(err, tree) {
          if (err) { cb(err); return; }
          GH.api('POST', '/git/commits', { message: 'CMS: update ' + filename, tree: tree.sha, parents: [headSha] }, function(err, newCommit) {
            if (err) { cb(err); return; }
            GH.api('PATCH', '/git/refs/heads/' + GH.branch, { sha: newCommit.sha }, function(err) { cb(err); });
          });
        });
      });
    });
  });
};
GH.deleteFile = function(filename, cb) {
  GH.api('GET', '/contents/' + filename, null, function(err, data) {
    if (err || !data || !data.sha) { if (cb) cb(); return; }
    GH.api('DELETE', '/contents/' + filename, { message: 'CMS: delete ' + filename, sha: data.sha }, function() { if (cb) cb(); });
  });
};
function requireToken(cb) { if (GH.token()) { cb(); return; } openTokenSettings(cb); }
function openTokenSettings(onSaveCb) {
  document.getElementById('m-token').classList.add('open');
  document.getElementById('tk-inp').value = GH.token();
  window._tkCb = onSaveCb || null;
}
function saveToken() {
  var tk = document.getElementById('tk-inp').value.trim();
  if (!tk) { toast('Token requis'); return; }
  toast('Validation...');
  fetch('https://api.github.com/repos/' + GH.owner + '/' + GH.repo, {
    headers: { 'Authorization': 'Bearer ' + tk, 'Accept': 'application/vnd.github+json' }
  }).then(function(r) {
    if (r.ok) { localStorage.setItem('gh_token', tk); closeM('m-token'); toast('✅ Token enregistré');
      if (window._tkCb) { window._tkCb(); window._tkCb = null; }
    } else { toast('❌ Token invalide'); }
  }).catch(function() { toast('❌ Erreur réseau'); });
}
function maybeAutoSeed() { renderDash(); }


var CID = null, CF = {}, CIM = {}, changes = 0, dupId = null, renId = null;

// ── Navigation ────────────────────────────────
function goTo(name, btn) {
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.sb-btn').forEach(function(b) { b.classList.remove('active'); });
  var panel = document.getElementById('p-' + name);
  if (panel) panel.classList.add('active');
  if (btn) btn.classList.add('active');
  var titles = { dashboard: ['Tableau de bord','Vue générale'], pages: ['Mes pages','Gérer vos pages'], editor: ['Éditeur','Modifier le contenu'] };
  var t = titles[name] || ['',''];
  document.getElementById('tb-title').textContent = t[0];
  document.getElementById('tb-sub').textContent = t[1];
  document.getElementById('tb-r').innerHTML = '';
  if (name === 'dashboard') renderDash();
  if (name === 'pages') renderPages();
}

// ── Dashboard ─────────────────────────────────
function renderDash() {
  dbAll(function(pages) {
    var live = pages.filter(function(p) { return p.status === 'live'; }).length;
    document.getElementById('s-pages').textContent = pages.length;
    document.getElementById('s-live').textContent = live;
    document.getElementById('s-draft').textContent = pages.length - live;
    document.getElementById('s-mods').textContent = changes;
    var g = document.getElementById('d-grid');
    if (!pages.length) {
      g.innerHTML = '<div class="emp"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><h3>Aucune page</h3><p>Importez votre première landing page HTML.</p><button class="btn btn-p" onclick="openImport()">Importer une page</button></div>';
      return;
    }
    g.innerHTML = pages.slice(-6).reverse().map(cardHTML).join('') + addCard();
  });
}

// ── Pages list ────────────────────────────────
function renderPages() {
  var q = (document.getElementById('srch') || {}).value || '';
  dbAll(function(pages) {
    var f = pages.filter(function(p) { return !q || p.name.toLowerCase().indexOf(q.toLowerCase()) > -1; });
    var g = document.getElementById('pg-grid');
    if (!f.length) {
      g.innerHTML = '<div class="emp"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><h3>Aucune page</h3><p>Importez une landing page.</p><button class="btn btn-p" onclick="openImport()">Importer</button></div>';
      return;
    }
    g.innerHTML = f.map(cardHTML).join('') + addCard();
  });
}

function addCard() {
  return '<div class="pc-add" onclick="openImport()"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg><span>Importer une page</span></div>';
}

function cardHTML(p) {
  var id = p.id;
  return '<div class="pc">' +
    '<div class="pc-th" onclick="editPage(\'' + id + '\')">' +
    '<div class="pc-letter">' + p.name[0].toUpperCase() + '</div>' +
    '<span class="pc-bdg ' + (p.status === 'live' ? 'bl' : 'bd') + '">' + (p.status === 'live' ? 'En ligne' : 'Brouillon') + '</span>' +
    '</div>' +
    '<div class="pc-body">' +
    '<div class="pc-name" onclick="editPage(\'' + id + '\')">' + esc(p.name) + '</div>' +
    '<div class="pc-slug">/' + esc(p.slug) + '.html</div>' +
    (p.status === 'live' && p.liveSlug ? '<div class="pc-url" title="' + GH.pagesBase + p.liveSlug + '.html">↗ ' + GH.pagesBase + p.liveSlug + '.html</div>' : '') +
    '<div class="pc-acts">' +
    (p.status === 'live' && p.liveSlug ? '<a href="' + GH.pagesBase + p.liveSlug + '.html" target="_blank" class="btn btn-v btn-sm" title="Voir en ligne"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg></a>' : '') +
    '<button class="btn btn-g btn-sm" onclick="editPage(\'' + id + '\')" title="Éditer"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>' +
    '<button class="btn btn-g btn-sm" onclick="openDup(\'' + id + '\')" title="Dupliquer"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></button>' +
    '<button class="btn btn-g btn-sm" onclick="openRen(\'' + id + '\')" title="Renommer"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z"/></svg></button>' +
    '<button class="btn btn-g btn-sm" onclick="dlPage(\'' + id + '\')" title="Télécharger"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg></button>' +
    '<button class="btn btn-d btn-sm" onclick="delPage(\'' + id + '\')" title="Supprimer"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>' +
    '</div></div></div>';
}

// ── Import ─────────────────────────────────────
function openImport() { document.getElementById('m-import').classList.add('open'); }

function handleFile(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var html = ev.target.result;
    var raw = file.name.replace('.html', '');
    var name = raw.replace(/-/g, ' ').replace(/(^|\s)\S/g, function(c) { return c.toUpperCase(); });
    var page = {
      id: 'p' + Date.now(),
      name: name,
      slug: raw,
      status: 'draft',
      created: new Date().toISOString(),
      modified: new Date().toISOString(),
      html: html,
      fields: extractFields(html),
      images: extractImages(html)
    };
    dbPut(page, function() {
      closeM('m-import');
      document.getElementById('fi').value = '';
      toast('✅ Importée : ' + name);
      renderDash();
      renderPages();
    });
  };
  reader.readAsText(file);
}

// drag & drop
var dzEl = document.getElementById('dz');
dzEl.addEventListener('dragover', function(e) { e.preventDefault(); dzEl.classList.add('over'); });
dzEl.addEventListener('dragleave', function() { dzEl.classList.remove('over'); });
dzEl.addEventListener('drop', function(e) {
  e.preventDefault(); dzEl.classList.remove('over');
  var f = e.dataTransfer.files[0];
  if (f && f.name.endsWith('.html')) {
    var dt = new DataTransfer(); dt.items.add(f);
    document.getElementById('fi').files = dt.files;
    handleFile({ target: document.getElementById('fi') });
  }
});

// ── Field extraction ───────────────────────────
function extractFields(html) {
  var f = {};
  function match(re, flags) { var m = html.match(new RegExp(re, flags || '')); return m ? (m[1] || m[0]) : ''; }
  function strip(s) { return (s || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').replace(/&amp;/g, '&').replace(/&nbsp;/g, ' ').trim(); }

  f.promo_label = match('OFFRE[^<]{0,25}');
  f.promo_text  = match("jusqu'au[^<]{0,60}");
  f.phone       = match('(\\d{2} \\d{2} \\d{2} \\d{2} \\d{2})');
  f.deadline    = match('(\\d{2}/\\d{2}/\\d{4})');

  var h1 = html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/);
  if (h1) f.hero_h1 = strip(h1[1]);
  var sub = html.match(/Formation 100%[^<]{0,200}/);
  if (sub) f.hero_sub = strip(sub[0]);
  var bdg = html.match(/Sessions ouvertes[^<]{0,80}/);
  if (bdg) f.hero_badge = strip(bdg[0]);
  f.cta1 = html.indexOf('Réserver mon appel') > -1 ? 'Réserver mon appel gratuit' : '';
  f.cta2 = html.indexOf('Tester mon éligibilité') > -1 ? 'Tester mon éligibilité CPF' : '';

  var sre = /font-semibold text-orange">(.*?)<\/p>/g, sm, sn = [];
  while ((sm = sre.exec(html)) && sn.length < 4) sn.push(sm[1].trim());
  for (var i = 0; i < 4; i++) f['s' + (i+1) + 'n'] = sn[i] || '';

  var pm = html.match(/6 semaines pour passer[^<]{0,80}/); if (pm) f.prog_h2 = strip(pm[0]);
  var pdm = html.match(/Un parcours structuré[^<]{0,200}/); if (pdm) f.prog_desc = strip(pdm[0]);
  var fb = html.match(/15 ans d'expérience[^<]{0,200}/); if (fb) f.fred_bio = strip(fb[0]);
  f.fred_role = html.indexOf('Designer 3D') > -1 ? 'Designer 3D & spécialiste SolidWorks' : '';
  var eb = html.match(/\+10 ans dans l'architecture[^<]{0,200}/); if (eb) f.edou_bio = strip(eb[0]);
  f.edou_role = html.indexOf('Architecte &') > -1 ? 'Architecte & référent BIM' : '';

  var pr = html.match(/text-5xl font-semibold text-navy">(\d[\d\s€]+)</); if (pr) f.price = pr[1].trim();
  var po = html.match(/line-through[^>]*>([^<]{1,20})</); if (po) f.price_old = po[1].trim();
  var pc = html.match(/text-2xl font-semibold text-orange">(\d[\d€]+)</); if (pc) f.price_cpf = pc[1].trim();

  var tre = /"([^"]{40,200})"/g, tm, tq = [];
  while ((tm = tre.exec(html)) && tq.length < 3) {
    if (/semaines|formateur|CPF|modéliser|freelance|reconversion/.test(tm[1])) tq.push(tm[1]);
  }
  var tn = ['Didier','Jérémie','Lucas'], tr = ['Syndic de copropriété', 'Paysagiste', 'Designer industriel · ancien apprenant'];
  for (var j = 0; j < 3; j++) { f['t'+(j+1)+'q'] = tq[j] || ''; f['t'+(j+1)+'n'] = tn[j]; f['t'+(j+1)+'r'] = tr[j]; }

  var ch = html.match(/<h2 class="font-display text-4xl[^>]*>([\s\S]*?)<\/h2>/); if (ch) f.cta_h2 = strip(ch[1]);
  var cs = html.match(/Choisissez directement[^<]{0,200}/); if (cs) f.cta_sub = strip(cs[0]);

  // Formateurs galerie 5-8
  var tDefName = ['Sarah M.','Thomas R.','Camille B.','Julien F.'];
  var tDefRole = ['SolidWorks','Modélisation 3D','CAO Mécanique','Design industriel'];
  var tDefExp = ["9 ans d'exp.","7 ans d'exp.","6 ans d'exp.","8 ans d'exp."];
  for (var tgi = 5; tgi <= 13; tgi++) {
    var idx0 = tgi - 5;
    var tnm = html.match(new RegExp('data-trainer-name="' + tgi + '"[^>]*>([^<]+)<'));
    var trl = html.match(new RegExp('data-trainer-role="' + tgi + '"[^>]*>([^<]+)<'));
    var tep = html.match(new RegExp('data-trainer-exp="' + tgi + '"[^>]*>([^<]+)<'));
    f['t'+tgi+'_name'] = tnm ? tnm[1].trim() : tDefName[idx0];
    f['t'+tgi+'_role'] = trl ? trl[1].trim() : tDefRole[idx0];
    f['t'+tgi+'_exp']  = tep ? tep[1].trim() : tDefExp[idx0];
  }

  // Recruteurs marquee — images (data-rec-img attributes)
  for (var ri = 1; ri <= 8; ri++) {
    var tagM = html.match(new RegExp('<img[^>]*data-rec-img="' + ri + '"[^>]*>'));
    var rim  = tagM ? tagM[0].match(/\bsrc="([^"]*)"/) : null;
    f['rec_img_'+ri] = rim ? rim[1] : '';
  }

  // Champs génériques data-cms
  var dcKeys = (html.match(/data-cms="([^"]+)"/g) || []).map(function(s) { return s.replace(/data-cms="|"/g, ''); });
  var dcUniq = dcKeys.filter(function(k, i) { return dcKeys.indexOf(k) === i; });
  dcUniq.forEach(function(key) {
    if (f[key] !== undefined) return;
    var re = new RegExp('data-cms="' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '"[^>]*>([^<]*)(?=<)');
    var m = html.match(re);
    if (m) f[key] = m[1].trim();
  });

  return f;
}

function extractImages(html) {
  return []; // images déjà embarquées dans page.html, pas besoin de les dupliquer
}

// ── Editor ─────────────────────────────────────
function editPage(id) {
  CID = id; CF = {}; CIM = {}; changes = 0;
  dbGet(id, function(page) {
    if (!page) { toast('Page introuvable'); return; }
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.sb-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('p-editor').classList.add('active');
    document.getElementById('tb-title').textContent = page.name;
    document.getElementById('tb-sub').textContent = 'Chargement depuis GitHub...';
    document.getElementById('tb-r').innerHTML = '';
    var filename = (page.liveSlug || page.slug) + '.html';
    GH.getFilePublic(filename, function(err, html) {
      if (html) { page.html = html; page.fields = extractFields(html); dbPut(page); }
      Object.assign(CF, page.fields || {});
      document.getElementById('tb-sub').textContent = 'Éditeur de contenu';
      document.getElementById('tb-r').innerHTML =
        '<button class="btn btn-g" onclick="goTo(\'pages\',null)">← Retour</button>' +
        '<button class="btn btn-g" onclick="saveAndDl()"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg> Télécharger</button>' +
        '<button class="btn btn-p" onclick="publishPage()"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16V12m0 0V8m0 4h4m-4 0H3m14 4v-4m0 0V8m0 4h4m-4 0h-4M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg> Publier</button>';
      buildEditor(page);
    });
  });
}

function mkField(key, label, val, type) {
  var input = type === 'ta'
    ? '<textarea id="f_' + key + '" rows="2" onchange="trackF(this,\'' + key + '\')">' + esc(val || '') + '</textarea>'
    : '<input type="text" id="f_' + key + '" value="' + esc(val || '') + '" onchange="trackF(this,\'' + key + '\')">';
  return '<div class="fld" id="fw_' + key + '"><label class="lbl">' + label + '</label>' + input + '</div>';
}
function mkFC(title, body, id) {
  return '<div class="fc" id="fc-' + id + '">' +
    '<div class="fch" onclick="tfc(this)"><div class="fci"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div>' +
    '<div class="fct">' + title + '</div>' +
    '<svg class="fca" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg></div>' +
    '<div class="fcb">' + body + '</div></div>';
}
function tfc(h) { h.closest('.fc').classList.toggle('col'); }
function trackF(el, key) {
  CF[key] = el.value;
  var w = document.getElementById('fw_' + key); if (w) w.classList.add('chg');
  changes++; document.getElementById('s-mods').textContent = changes;
  toast('Modifié');
}

function buildEditor(page) {
  var f = page.fields || {}, imgs = page.images || [];
  var h = '';
  h += mkFC('Promo & Contact',
    '<div class="g3">' + mkField('promo_label','Label offre',f.promo_label) + mkField('promo_text','Texte promo',f.promo_text) + mkField('phone','Téléphone',f.phone) + '</div>' +
    mkField('deadline','Date limite offre',f.deadline), 'promo');
  h += mkFC('Hero',
    mkField('hero_h1','Titre H1',f.hero_h1,'ta') +
    '<div class="g2">' + mkField('hero_sub','Sous-titre',f.hero_sub,'ta') + mkField('hero_badge','Badge disponibilité',f.hero_badge) + '</div>' +
    '<div class="g2">' + mkField('cta1','CTA principal',f.cta1) + mkField('cta2','CTA secondaire',f.cta2) + '</div>' +
    '<div class="g2">' + mkField('hero_trust1','Trustpilot — Note',f.hero_trust1) + mkField('hero_trust2','Trustpilot — Label',f.hero_trust2) + '</div>' +
    '<div class="g2">' + mkField('promo_badge','Badge promo (topbar)',f.promo_badge) + '</div>', 'hero');

function setSt(v, el) {
  document.querySelectorAll('#sr-row .so').forEach(function(o) { o.classList.remove('sl','sd'); });
  el.classList.add(v === 'live' ? 'sl' : 'sd');
  dbGet(CID, function(p) { if (p) { p.status = v; dbPut(p); } });
  toast(v === 'live' ? 'Statut : En ligne' : 'Statut : Brouillon');
}

function repImg(inp, idx) {
  var file = inp.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    CIM[idx] = e.target.result;
    var el = document.getElementById('ip' + idx); if (el) { el.src = e.target.result; el.style.display = 'block'; }
    var ph = document.getElementById('ph' + idx); if (ph) ph.style.display = 'none';
    toast('Image remplacée');
  };
  reader.readAsDataURL(file);
}

function repRecImg(inp, idx) {
  var file = inp.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    CF['rec_img_'+idx] = e.target.result;
    var el = document.getElementById('rip'+idx); if (el) { el.src = e.target.result; el.style.display = 'block'; }
    var ph = document.getElementById('rph'+idx); if (ph) ph.style.display = 'none';
    toast('Logo entreprise remplacé');
  };
  reader.readAsDataURL(file);
}

// ── Build HTML for export (shared by download & publish) ──
function buildHtmlForExport(page, cb) {
  var out = page.html, f = CF;
  function rep(search, replacement) {
    if (!search || !replacement || search === replacement) return;
    var escaped = search.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
    out = out.replace(new RegExp(escaped, 'g'), replacement);
  }
  if (f.phone) out = out.replace(/\d{2} \d{2} \d{2} \d{2} \d{2}/g, f.phone);
  if (f.deadline) out = out.replace(/\d{2}\/\d{2}\/\d{4}/g, f.deadline);
  if (f.promo_text) { var m1 = out.match(/jusqu'au[^<]{0,60}/); if (m1) rep(m1[0], f.promo_text); }
  if (f.hero_badge) { var m2 = out.match(/Sessions ouvertes[^<]{0,80}/); if (m2) rep(m2[0], f.hero_badge); }
  if (f.hero_sub)   { var m3 = out.match(/Formation 100%[^<]{0,200}/); if (m3) rep(m3[0], f.hero_sub); }
  if (f.prog_h2)    { var m4 = out.match(/6 semaines pour passer[^<]{0,80}/); if (m4) rep(m4[0], f.prog_h2); }
  if (f.fred_bio)   { var m5 = out.match(/15 ans d'expérience[^<]{0,200}/); if (m5) rep(m5[0], f.fred_bio); }
  if (f.edou_bio)   { var m6 = out.match(/\+10 ans dans l'architecture[^<]{0,200}/); if (m6) rep(m6[0], f.edou_bio); }
  if (f.fred_role) out = out.replace(/Designer 3D &amp; spécialiste SolidWorks/g, f.fred_role.replace(/&/g,'&amp;'));
  if (f.edou_role) out = out.replace(/Architecte &amp; référent BIM/g, f.edou_role.replace(/&/g,'&amp;'));
  if (f.price)     out = out.replace(/1 650€/g, f.price);
  if (f.price_old) out = out.replace(/1 833€/g, f.price_old);
  for (var i = 1; i <= 3; i++) {
    if (f['t'+i+'q'] && page.fields['t'+i+'q']) rep('"' + page.fields['t'+i+'q'] + '"', '"' + f['t'+i+'q'] + '"');
  }
  var imgList = page.images || [];
  Object.keys(CIM).forEach(function(idx) {
    var orig = imgList[parseInt(idx)];
    if (orig && orig.src) { out = out.replace(orig.src, CIM[idx]); imgList[parseInt(idx)].src = CIM[idx]; }
  });
  // Formateurs galerie 5-8
  for (var tgi = 5; tgi <= 13; tgi++) {
    ['name','role','exp'].forEach(function(attr) {
      var key = 't' + tgi + '_' + attr;
      var oldVal = (page.fields || {})[key];
      var newVal = f[key];
      if (oldVal && newVal && oldVal !== newVal) {
        out = out.replace(
          new RegExp('(data-trainer-' + attr + '="' + tgi + '"[^>]*>)[^<]*(<)', 'g'),
          '$1' + newVal.replace(/\$/g,'$$$$') + '$2'
        );
      }
    });
  }

  // Recruteurs marquee — logos image (×2 dans la marquee dupliquée)
  for (var ri = 1; ri <= 8; ri++) {
    var recImg = f['rec_img_'+ri];
    if (recImg) {
      var _safeImg = recImg;
      out = out.replace(
        new RegExp('<img[^>]*data-rec-img="' + ri + '"[^>]*>', 'g'),
        function(tag) {
          return tag.replace(/\bsrc="[^"]*"/, 'src="' + _safeImg.replace(/\$/g, '$$$$') + '"');
        }
      );
    }
  }

  // Substitution générique data-cms
  var dcExp = (out.match(/data-cms="([^"]+)"/g) || []).map(function(s) { return s.replace(/data-cms="|"/g, ''); });
  var dcExpUniq = dcExp.filter(function(k, i) { return dcExp.indexOf(k) === i; });
  dcExpUniq.forEach(function(key) {
    if (!f[key]) return;
    var oldV = (page.fields || {})[key];
    if (!oldV || oldV === f[key]) return;
    var escapedKey = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(
      new RegExp('(data-cms="' + escapedKey + '"[^>]*>)[^<]*(<)', 'g'),
      '$1' + f[key].replace(/\$/g, '$$$$') + '$2'
    );
  });

  var newSlug = (document.getElementById('ed-slug') || {}).value || page.slug;
  page.html = out; page.fields = Object.assign({}, page.fields, f);
  page.images = imgList; page.slug = newSlug; page.modified = new Date().toISOString();
  cb(page, out);
}

// ── Save & Download ────────────────────────────
function saveAndDl() {
  dbGet(CID, function(page) {
    if (!page) { toast('Page introuvable'); return; }
    buildHtmlForExport(page, function(page, out) {
      dbPut(page);
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([out], { type: 'text/html' }));
      a.download = page.slug + '-modifie.html';
      a.click(); URL.revokeObjectURL(a.href);
      toast('✅ Téléchargé : ' + page.slug + '-modifie.html');
    });
  });
}

// ── Publish to GitHub Pages ────────────────────

// ── Resync template depuis GitHub ─────────────────────────────────────────
function resyncFromGitHub() {
  requireToken(function() {
    dbGet(CID, function(page) {
      if (!page) { toast('Page introuvable'); return; }
      var filename = (page.liveSlug || page.slug) + '.html';
      toast('Resync en cours depuis GitHub...');
      GH.getFilePublic(filename, function(err, html) {
        if (!html) { toast('❌ Fichier introuvable sur GitHub : ' + filename); return; }
        // Preserve existing fields (logos, textes déjà sauvegardés)
        var mergedFields = Object.assign({}, extractFields(html), page.fields || {});
        page.html = html;
        page.fields = mergedFields;
        page.modified = new Date().toISOString();
        Object.assign(CF, mergedFields);
        dbPut(page, function() {
          toast('✅ Template resynced depuis GitHub — publie pour mettre en ligne');
        });
      });
    });
  });
}

function publishPage() {
  requireToken(function() {
    dbGet(CID, function(page) {
      if (!page) { toast('Page introuvable'); return; }
      var oldSlug = page.liveSlug || null;
      // Resync automatique depuis GitHub avant publication
      var filename = (page.liveSlug || page.slug) + '.html';
      toast('Synchronisation depuis GitHub...');
      GH.getFilePublic(filename, function(err, freshHtml) {
        if (freshHtml) {
          page.html = freshHtml;
          page.fields = Object.assign({}, extractFields(freshHtml), page.fields || {});
          Object.assign(CF, page.fields);
        }
        toast('Publication en cours...');
        buildHtmlForExport(page, function(updatedPage, out) {
        var filename = updatedPage.slug + '.html';
        GH.putFileLarge(filename, out, function(err) {
          if (err) { toast('❌ Erreur GitHub : ' + err); return; }
          if (oldSlug && oldSlug !== updatedPage.slug) {
            GH.deleteFile(oldSlug + '.html');
          }
          updatedPage.status = 'live';
          updatedPage.liveSlug = updatedPage.slug;
          var toStore = Object.assign({}, updatedPage, { html: '' });
          dbPut(toStore, function() {
            toast('✅ Publié ! Dispo dans ~1 min sur GitHub Pages');
            editPage(CID);
          });
        });
      });
    });
  });
}

function dlPage(id) {
  dbGet(id, function(p) {
    if (!p) return;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([p.html], { type: 'text/html' }));
    a.download = p.slug + '.html'; a.click(); URL.revokeObjectURL(a.href);
    toast('✅ ' + p.slug + '.html');
  });
}

function openDup(id) {
  dupId = id;
  dbGet(id, function(p) {
    document.getElementById('dup-n').value = p.name + ' — Copie';
    document.getElementById('dup-s').value = p.slug + '-copie';
    document.getElementById('m-dup').classList.add('open');

function confirmDup() {
  var n = document.getElementById('dup-n').value.trim();
  var s = document.getElementById('dup-s').value.trim();
  if (!n || !s) { toast('Remplissez les deux champs'); return; }
  dbGet(dupId, function(p) {
    var np = JSON.parse(JSON.stringify(p));
    np.id = 'p' + Date.now(); np.name = n; np.slug = s;
    np.status = 'draft'; np.created = new Date().toISOString(); np.modified = new Date().toISOString();
    dbPut(np, function() { closeM('m-dup'); toast('✅ Dupliquée : ' + n); renderPages(); renderDash(); editPage(np.id); });
  });
}

// ── Rename ─────────────────────────────────────
function openRen(id) {
  renId = id;
  dbGet(id, function(p) {
    document.getElementById('ren-n').value = p.name;
    document.getElementById('ren-s').value = p.slug;
    document.getElementById('m-ren').classList.add('open');
  });
}
function confirmRen() {
  var n = document.getElementById('ren-n').value.trim();
  var s = document.getElementById('ren-s').value.trim();
  if (!n || !s) { toast('Remplissez les deux champs'); return; }
  dbGet(renId, function(p) {
    p.name = n; p.slug = s; p.modified = new Date().toISOString();
    dbPut(p, function() { closeM('m-ren'); toast('✅ Renommée : ' + n); renderPages(); renderDash(); });
  });
}

// ── Delete ─────────────────────────────────────
function delPage(id) {
  if (!confirm('Supprimer cette page ? Action irréversible.')) return;
  dbDel(id, function() { toast('Supprimée'); goTo('pages', null); renderPages(); renderDash(); });
}

// ── Utils ──────────────────────────────────────
function closeM(id) { document.getElementById(id).classList.remove('open'); }
function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg) {
  var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function() { t.classList.remove('show'); }, 2400);
}

document.querySelectorAll('.ov').forEach(function(o) {
  o.addEventListener('click', function(e) { if (e.target === o) o.classList.remove('open'); });
});

maybeAutoSeed();
</script>
</body>
